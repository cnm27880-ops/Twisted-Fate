  // ===== 花名冊 =====
  // 花名冊的境界跟角色卡連動：弟子在角色卡上突破了，名冊這一欄自動跟著走，
  // 不必兩邊各改一次，也不會再出現「卡上金丹、名冊還寫築基」的落差。
  //
  // 對應方式是姓名精準比對（花名冊的姓名 ←→ 角色卡的角色尊名）。同名有兩張以上的卡
  // 就不自動連動——寧可讓長老手動填，也不要連到錯的人身上。
  // 想自己填的那一列，按境界欄旁邊的鎖鏈鈕切成「手動」即可（存成 realmLink:"manual"）。
  function charNameIndex(){
    const idx = new Map();
    Object.values(chars).forEach(c => {
      if(!c || typeof c !== "object") return;
      const n = String(c.name || "").trim();
      if(!n) return;
      if(idx.has(n)) idx.set(n, null);        // 同名多張卡：一律不自動連動
      else idx.set(n, c);
    });
    return idx;
  }
  let _charNameIdx = null;
  function linkedCharFor(m){
    if(!m || m.realmLink === "manual") return null;
    if(!_charNameIdx) _charNameIdx = charNameIndex();
    return _charNameIdx.get(String(m.name || "").trim()) || null;
  }
  // 有連動就以角色卡為準；角色卡上還沒填境界，就退回名冊自己記的那一筆
  function memberRealm(m){
    const c = linkedCharFor(m);
    const fromCard = c ? String(c.realm || "").trim() : "";
    return fromCard || String((m && m.realm) || "").trim();
  }

  function majorRealm(realm){
    const r = (realm || "").trim();
    if(!r) return "未記錄";
    return r.slice(0, 2);
  }

  // 境界排序：先比大境界（煉氣→築基→金丹……），同一個大境界再比層數或期別。
  // 「煉氣圓滿」要排在「煉氣九層」後面，所以期別的分數一律加在層數之上。
  // 沒填境界的給 Infinity，兩個方向都墊底。
  const REALM_MAJORS = ["煉氣","築基","金丹","元嬰","化神","煉虛","合體","大乘","渡劫"];
  const REALM_STAGES = ["初期","中期","後期","圓滿"];
  const CN_NUM = { "一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10 };
  function realmScore(realm){
    const r = String(realm == null ? "" : realm).trim();
    if(!r) return Infinity;
    const major = REALM_MAJORS.indexOf(r.slice(0, 2));
    const base = (major < 0 ? REALM_MAJORS.length : major) * 100;
    const layer = r.match(/([一二三四五六七八九十])層/);
    if(layer) return base + (CN_NUM[layer[1]] || 0);
    const stage = REALM_STAGES.findIndex(x => r.includes(x));
    if(stage >= 0) return base + 20 + stage;
    return base + 50;      // 認得大境界但寫法特別的，排在該境界最後
  }

  // Firebase 上偶爾會留下不是物件的殘骸（例如寫壞的節點），先濾掉再統計，
  // 免得統計數字多一個人、名冊卻翻不到那一列。
  function rosterEntries(){
    return Object.entries(roster).filter(([,m]) => m && typeof m === "object");
  }

  function rosterHtml(editable){
    _charNameIdx = null;                 // 每次重畫都用最新的角色卡重建對應表
    const all = rosterEntries();
    // 境界統計：以境界前兩字分組（煉氣／築基／金丹…），並保留完整子境界細分
    const groups = {};
    all.forEach(([,m]) => {
      const realm = memberRealm(m);      // 有連動角色卡的以卡上為準
      const g = majorRealm(realm);
      if(!groups[g]) groups[g] = { count:0, detail:{} };
      groups[g].count++;
      const full = realm || "未記錄";
      groups[g].detail[full] = (groups[g].detail[full] || 0) + 1;
    });
    const maxCount = Math.max(1, ...Object.values(groups).map(g => g.count));
    const groupOrder = Object.entries(groups).sort((a,b) => b[1].count - a[1].count);

    return `
      <div class="block-title">境界人數統計<span class="spacer"></span>
        <span style="font-size:12px;font-weight:400;color:var(--ink-faint2);">依花名冊即時計算，共 ${all.length} 人</span>
      </div>
      ${groupOrder.length === 0
        ? `<div class="notice info" style="font-weight:400;">花名冊尚無資料。</div>`
        : `<div class="realm-stats">${groupOrder.map(([g,data]) => `
            <button type="button" class="realm-card${g === "未記錄" ? " unknown" : ""}${rosterRealmFilter === g ? " on" : ""}"
              data-realm-pick="${attr(g)}" title="只看${escapeHtml(g)}的弟子，再點一次取消">
              <div class="realm-card-head"><span class="realm-name">${escapeHtml(g)}</span><span class="realm-count">${data.count}</span></div>
              <div class="realm-bar-track"><div class="realm-bar" style="width:${(data.count/maxCount*100).toFixed(1)}%"></div></div>
              <div class="realm-detail">${Object.entries(data.detail).sort((a,b)=>b[1]-a[1])
                .map(([k,v]) => `<span>${escapeHtml(k)} <b>${v}</b></span>`).join("")}</div>
            </button>`).join("")}</div>`}

      <div class="block-title" style="margin-top:30px;">弟子花名冊<span class="spacer"></span>
        ${editable ? `<button class="btn gold" data-action="add-member">＋ 收錄弟子</button>` : ""}
      </div>
      <div class="filter-row">
        <input class="search-input" id="rosterSearch" placeholder="搜尋姓名／職位／靈根／職業／道途／境界／師傅……" value="${attr(rosterFilter)}">
        <select class="filter-select" id="rosterSort" title="名冊排序">
          <option value="rank" ${rosterSort==="rank"?"selected":""}>依階級</option>
          <option value="realmDesc" ${rosterSort==="realmDesc"?"selected":""}>依境界（高→低）</option>
          <option value="realmAsc" ${rosterSort==="realmAsc"?"selected":""}>依境界（低→高）</option>
          <option value="job" ${rosterSort==="job"?"selected":""}>依職業</option>
          <option value="name" ${rosterSort==="name"?"selected":""}>依姓名</option>
        </select>
        <span class="realm-chip" id="realmFilterChip" style="display:${rosterRealmFilter ? "inline-flex" : "none"};">
          <span id="realmFilterText">${rosterRealmFilter ? "只看境界【" + escapeHtml(rosterRealmFilter) + "】" : ""}</span>
          <button type="button" class="chip-x" id="realmFilterClear" title="取消境界篩選">${SVG.cross()}</button>
        </span>
      </div>
      <div class="notice info" style="font-weight:400;">
        上面的境界卡可以點：點「未記錄」就只列出沒填境界的弟子，不必在名冊裡一列列翻。
        名冊裡沒填的欄位會用虛線框標起來，排序也可以改成依境界或依職業。<br>
        <b>境界連動</b>：名冊姓名和角色卡的角色尊名一樣時，境界一欄會直接顯示<b>角色卡上的境界</b>（綠底那格），
        玩家在卡上突破就自動跟著更新，這裡不必再改一次；上面的統計、排序與篩選也都是照連動後的境界計算。
        要改回自己填的話，按那一格旁邊的鎖鏈鈕即可。同名有兩張以上角色卡時不會自動連動，以免連錯人。
      </div>
      <div class="sub-tabs">
        <button class="sub-tab ${rosterRank==="全部"?"active":""}" data-rank="全部">全部（${all.length}）</button>
        ${RANKS.map(r => `<button class="sub-tab ${rosterRank===r?"active":""}" data-rank="${r}">${r}（${all.filter(([,m])=>(m.rank||"記名")===r).length}）</button>`).join("")}
      </div>
      <div class="table-wrap" id="rosterTableWrap">${rosterTableHtml(editable)}</div>`;
  }

  // 切換階級分頁或搜尋時只重畫這張表，上面的境界統計不動
  const ROSTER_SORTERS = (() => {
    const byName = (a, b) => String(a[1].name || "").localeCompare(String(b[1].name || ""), "zh-Hant");
    // 沒填的職業排最後，不要跟有填的混在一起
    const jobKey = m => String(m.job || "").trim() || "\uFFFF";
    const byRealm = dir => (a, b) => {
      const x = realmScore(memberRealm(a[1])), y = realmScore(memberRealm(b[1]));
      if(x === y) return byName(a, b);
      if(!isFinite(x)) return 1;          // 未填境界的兩個方向都墊底
      if(!isFinite(y)) return -1;
      return dir * (x - y);
    };
    return {
      rank: (a, b) => RANKS.indexOf(a[1].rank || "記名") - RANKS.indexOf(b[1].rank || "記名") || byName(a, b),
      realmAsc: byRealm(1),
      realmDesc: byRealm(-1),
      job: (a, b) => jobKey(a[1]).localeCompare(jobKey(b[1]), "zh-Hant") || byName(a, b),
      name: byName
    };
  })();

  function rosterTableHtml(editable){
    _charNameIdx = null;
    const filtered = rosterEntries().filter(([,m]) => {
      if(rosterRank !== "全部" && (m.rank || "記名") !== rosterRank) return false;
      if(rosterRealmFilter && majorRealm(memberRealm(m)) !== rosterRealmFilter) return false;
      if(!rosterFilter) return true;
      // 搜「未記錄」也要找得到沒填境界的人，不然那一格永遠翻不出來
      const hay = [m.name, m.title, m.root, m.job, m.path, memberRealm(m), m.master, majorRealm(memberRealm(m))]
        .join(" ").toLowerCase();
      return hay.includes(rosterFilter.toLowerCase());
    }).sort(ROSTER_SORTERS[rosterSort] || ROSTER_SORTERS.rank);
    return `
        <table class="sheet-table">
          <thead><tr>
            <th style="width:12%;">姓名</th>
            <th style="width:10%;">階級</th>
            <th style="width:14%;">職位</th>
            <th style="width:9%;">靈根</th>
            <th style="width:11%;">職業</th>
            <th style="width:9%;">道途</th>
            <th style="width:12%;">境界</th>
            <th style="width:11%;">師傅</th>
            ${editable ? `<th style="width:40px;"></th>` : ""}
          </tr></thead>
          <tbody>
            ${filtered.length === 0
              ? `<tr><td colspan="${editable?9:8}" class="empty-row">沒有符合條件的弟子</td></tr>`
              : filtered.map(([id,m]) => `
                <tr>
                  <td><input class="${String(m.name||"").trim() ? "" : "miss"}" data-r="${id}" data-prop="name" value="${attr(m.name)}" placeholder="未命名" ${editable?"":"disabled"}></td>
                  <td><select data-r="${id}" data-prop="rank" ${editable?"":"disabled"}>
                    ${RANKS.map(r => `<option value="${r}" ${(m.rank||"記名")===r?"selected":""}>${r}</option>`).join("")}
                  </select></td>
                  <td><input data-r="${id}" data-prop="title" value="${attr(m.title)}" placeholder="－" ${editable?"":"disabled"}></td>
                  <td><input class="${String(m.root||"").trim() ? "" : "miss"}" data-r="${id}" data-prop="root" value="${attr(m.root)}" placeholder="未記錄" ${editable?"":"disabled"}></td>
                  <td><input class="${String(m.job||"").trim() ? "" : "miss"}" data-r="${id}" data-prop="job" value="${attr(m.job)}" placeholder="未記錄" ${editable?"":"disabled"}></td>
                  <td><input data-r="${id}" data-prop="path" value="${attr(m.path)}" placeholder="－" ${editable?"":"disabled"}></td>
                  <td>${realmCellHtml(id, m, editable)}</td>
                  <td><input data-r="${id}" data-prop="master" value="${attr(m.master)}" placeholder="－" ${editable?"":"disabled"}></td>
                  ${editable ? `<td><button class="btn-icon" data-action="del-member" data-id="${id}" title="移出花名冊">${SVG.cross()}</button></td>` : ""}
                </tr>`).join("")}
          </tbody>
        </table>`;
  }

  // 境界欄：連動到角色卡時顯示卡上的境界（不可直接改，改角色卡即可），
  // 旁邊的鎖鏈鈕可以切成手動填寫（例如卡上還沒寫、或這位是同名的另一個人）。
  function realmCellHtml(id, m, editable){
    const linked = linkedCharFor(m);
    if(linked){
      const realm = String(linked.realm || "").trim();
      return `<div class="realm-cell">
        <span class="realm-linked${realm ? "" : " miss"}"
          title="與角色卡【${attr(linked.name)}】連動，境界請到角色卡上修改">${escapeHtml(realm || "角色卡尚未填寫")}</span>
        ${editable ? `<button class="btn-icon link-toggle on" data-action="unlink-realm" data-id="${id}"
          title="改為手動填寫，不再跟角色卡連動">${SVG.chain()}</button>` : ""}
      </div>`;
    }
    const canRelink = !!(editable && m.realmLink === "manual" && (_charNameIdx || charNameIndex()).get(String(m.name || "").trim()));
    return `<div class="realm-cell">
      <input class="${String(m.realm||"").trim() ? "" : "miss"}" data-r="${id}" data-prop="realm" value="${attr(m.realm)}" placeholder="未記錄" ${editable?"":"disabled"}>
      ${canRelink ? `<button class="btn-icon link-toggle" data-action="relink-realm" data-id="${id}"
        title="改回跟同名角色卡連動">${SVG.chain()}</button>` : ""}
    </div>`;
  }

  // ============================================================
  // 【山門殿宇】宗門基本資料與設施
  // ============================================================
  const UPKEEP_KINDS = [
    { k:"month", label:"每月" }, { k:"once", label:"單次" }, { k:"none", label:"不需靈石" }
  ];
  const gradeLabel = g => (STONE_KEYS.find(x => x.k === g) || {}).label || "中品靈石";
  const gradeShort = g => gradeLabel(g).replace("靈石", "");

  function facilityEntries(){
    return Object.entries(facilities).filter(([,f]) => f && typeof f === "object");
  }

  // 把設施的開銷依「每月／單次」分別按靈石等級加總。
  // 各等級是分開結算的（沒有假設任何兌換率），所以回傳的是 { low:n, mid:n, ... }。
  function upkeepTotals(kind){
    const out = {};
    STONE_KEYS.forEach(x => out[x.k] = 0);
    facilityEntries().forEach(([,f]) => {
      if((f.upkeepKind || "month") !== kind) return;
      const g = out[f.upkeepGrade] == null ? "mid" : f.upkeepGrade;
      out[g] += num(f.upkeepQty);
    });
    return out;
  }

  // 「還能撐幾個月」：每個等級各自用庫存除以該等級的月支出，取最緊的那一個。
  // 刻意不做等級之間的換算——一中品該換幾下品是天道說了算，程式不擅自假設。
  function monthsLeft(){
    const need = upkeepTotals("month");
    let worst = null;
    STONE_KEYS.forEach(x => {
      const per = need[x.k];
      if(per <= 0) return;
      const m = Math.floor(num(stones[x.k]) / per);
      if(worst === null || m < worst.months) worst = { months:m, key:x.k, per, have:num(stones[x.k]) };
    });
    return worst;   // null＝目前沒有任何每月開銷
  }

  function sectField(k, fallback){
    const v = sect && sect[k];
    return v == null || v === "" ? (fallback == null ? "" : fallback) : v;
  }
  function sectEnemies(){
    const e = sect && sect.enemies;
    if(Array.isArray(e)) return e.filter(Boolean);
    if(e && typeof e === "object") return Object.values(e).filter(Boolean);
    return String(e || "").split(/[、,，\s]+/).filter(Boolean);
  }

  // 頂部橫幅：門派等級、聲望、護山大陣、每月總支出、還能撐幾個月
  function sectBannerHtml(){
    if(!sect || !Object.keys(sect).length) return "";
    const need = upkeepTotals("month");
    const costText = STONE_KEYS.filter(x => need[x.k] > 0)
      .map(x => `<span>${escapeHtml(gradeShort(x.k))}<b>${need[x.k].toLocaleString()}</b></span>`).join("") || `<span>無</span>`;
    const left = monthsLeft();
    const lowOnStones = left && left.months <= 2;
    const enemies = sectEnemies();
    return `
      <div class="sect-banner${lowOnStones ? " alarm" : ""}">
        <div class="sb-main">
          ${SVG.gate("sb-sigil")}
          <div>
            <div class="sb-name">${escapeHtml(sectField("name", "本門"))}<span class="sb-level">${escapeHtml(sectField("level", "－"))}</span></div>
            <div class="sb-formation">護山大陣　${escapeHtml(sectField("formation", "－"))}</div>
          </div>
        </div>
        <div class="sb-cells">
          <div class="sb-cell"><div class="sb-label">門派聲望</div><div class="sb-value">${num(sectField("reputation", 0)).toLocaleString()}</div></div>
          <div class="sb-cell"><div class="sb-label">殿宇建築</div><div class="sb-value">${facilityEntries().length}</div></div>
          <div class="sb-cell wide"><div class="sb-label">每月開銷</div><div class="sb-cost">${costText}</div></div>
          <div class="sb-cell wide"><div class="sb-label">庫存可支撐</div>
            <div class="sb-value ${lowOnStones ? "danger" : ""}">${left === null ? "－" : left.months.toLocaleString() + " 個月"}</div>
            ${left === null ? "" : `<div class="sb-note">${escapeHtml(gradeShort(left.key))}最先見底</div>`}
          </div>
        </div>
        ${enemies.length ? `<div class="sb-enemies"><span class="sb-label">敵對勢力</span>${
          enemies.map(e => `<span class="sb-foe">${escapeHtml(e)}</span>`).join("")}</div>` : ""}
      </div>`;
  }

  // 信物索引：同一塊信物常常同時是好幾座建築的鑰匙，點一下就把用得到它的建築標出來
  let tokenFilter = "";
  function tokenIndex(){
    const map = new Map();
    facilityEntries().forEach(([,f]) => {
      toList(f.tokens).forEach(t => {
        const key = String(t).trim();
        if(!key) return;
        map.set(key, (map.get(key) || 0) + 1);
      });
    });
    return [...map.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"));
  }
  function toList(v){
    if(Array.isArray(v)) return v.filter(x => x != null && String(x).trim() !== "");
    if(v && typeof v === "object") return Object.values(v).filter(x => x != null && String(x).trim() !== "");
    return String(v == null ? "" : v).split(/[、,，\n]+/).map(x => x.trim()).filter(Boolean);
  }

  function facilityHtml(editable){
    // 不排序：Firebase 的 push key 本身就是時序，維持匯入／新建的順序最好認，
    // 照筆劃排反而會把山門、藏經閣這些有主從關係的建築打散。
    const list = facilityEntries();
    const monthNeed = upkeepTotals("month");
    const onceList = facilityEntries().filter(([,f]) => f.upkeepKind === "once");
    const left = monthsLeft();
    const tokens = tokenIndex();

    return `
      <div class="block-title">門派卷宗<span class="spacer"></span>
        <span style="font-size:12px;font-weight:400;color:var(--ink-faint2);">上方橫幅即時同步這裡的內容</span>
      </div>
      ${!(sect && Object.keys(sect).length) ? `<div class="notice info" style="font-weight:400;">
        還沒有門派資料。天道可以到【權限管理】按「匯入宗門設施」，把門派資料與 11 座建築一次寫進來。</div>` : ""}
      <div class="sect-form">
        <label class="sf-field"><span>門派名稱</span>
          <input data-s="name" value="${attr(sectField("name"))}" placeholder="例：無相門" ${editable?"":"disabled"}></label>
        <label class="sf-field"><span>門派等級</span>
          <input data-s="level" value="${attr(sectField("level"))}" placeholder="例：三級" ${editable?"":"disabled"}></label>
        <label class="sf-field"><span>門派聲望</span>
          <input data-s="reputation" type="number" value="${num(sectField("reputation", 0))}" ${editable?"":"disabled"}></label>
        <label class="sf-field wide"><span>護山大陣</span>
          <input data-s="formation" value="${attr(sectField("formation"))}" placeholder="例：五行幻獸大陣" ${editable?"":"disabled"}></label>
        <label class="sf-field wide"><span>敵對勢力</span>
          <input data-s="enemies" value="${attr(sectEnemies().join("、"))}" placeholder="用頓號分隔，例：六道聯盟、血手堂" ${editable?"":"disabled"}></label>
      </div>

      <div class="block-title" style="margin-top:30px;">本月開銷結算<span class="spacer"></span></div>
      <div class="upkeep-box">
        <div class="uk-row">
          <div class="uk-cell">
            <div class="uk-label">每月固定開銷</div>
            <div class="uk-value">${STONE_KEYS.filter(x => monthNeed[x.k] > 0)
              .map(x => `<span>${escapeHtml(gradeShort(x.k))} <b>${monthNeed[x.k].toLocaleString()}</b></span>`).join("") || "－"}</div>
          </div>
          <div class="uk-cell">
            <div class="uk-label">庫存可支撐</div>
            <div class="uk-value ${left && left.months <= 2 ? "danger" : ""}">${
              left === null ? "－" : `<b>${left.months.toLocaleString()}</b> 個月`}</div>
            ${left === null ? "" : `<div class="uk-note">${escapeHtml(gradeLabel(left.key))}庫存 ${left.have.toLocaleString()}，每月要用 ${left.per.toLocaleString()}，最先見底</div>`}
          </div>
          ${editable ? `<div class="uk-cell act">
            <button class="btn gold" data-action="settle-upkeep">結算本月設施消耗</button>
            ${lastSettle ? `<button class="btn" data-action="undo-settle" style="font-size:12px;padding:5px 10px;">↩ 撤銷「${escapeHtml(lastSettle.label)}」</button>` : ""}
            <div class="uk-note">按下去會直接從庫藏扣除上面的數額，並在流水帳留一筆；扣錯了可以馬上按撤銷。</div>
          </div>` : ""}
        </div>
        ${onceList.length ? `<div class="uk-once">
          <div class="uk-label">用一次扣一次</div>
          ${onceList.map(([id,f]) => `<div class="uk-once-row">
            <span class="uk-once-name">${escapeHtml(f.name || "未命名建築")}</span>

  // ===== 天機閣分析 (原簡報分析) =====
  function countBy(list, fn){
    const out = {};
    list.forEach(item => { const k = (fn(item) || "").trim() || "未記錄"; out[k] = (out[k] || 0) + 1; });
    return out;
  }

  function reportHtml(){
    const rosterList = Object.values(roster);
    const charList = Object.values(chars);
    const totalDisciples = rosterList.length;

    if(charList.length === 0) return `<div class="notice info" style="font-weight:400;">尚無角色卡資料，天機閣無法進行推演。</div>`;

    const pct = (cur, mx) => { const c = num(cur), m = num(mx); return m <= 0 ? null : Math.max(0, Math.min(100, c/m*100)); };

    // 1. 重傷瀕死名單 (HP <= 30%)
    const lowHp = charList.map(c => ({ c, p: pct(c.hp && c.hp.current, c.hp && c.hp.max) }))
      .filter(x => x.p != null && x.p <= 30).sort((a,b) => a.p - b.p);

    // 2. 靈氣底蘊排行榜 (Top 5)
    const topQi = [...charList].filter(c => num(c.qi?.max) > 0).sort((a,b) => num(b.qi?.max) - num(a.qi?.max)).slice(0, 5);

    // 3. 因果善惡榜
    const goodKarma = [...charList].filter(c => num(c.karma) < 0).sort((a,b) => num(a.karma) - num(b.karma)).slice(0, 5); // 越負越前面(功德)
    const badKarma = [...charList].filter(c => num(c.karma) > 0).sort((a,b) => num(b.karma) - num(a.karma)).slice(0, 5);  // 越正越前面(業障)

    // 4. 生態與運勢預警 (由花名冊推演)
    const pathCounts = countBy(rosterList, m => m.path);
    const jobCounts = countBy(rosterList, m => m.job);
    let warnings = [];

    // 檢查醫療/煉丹後勤
    const hasMedic = Object.keys(jobCounts).some(k => k.includes("丹") || k.includes("醫") || k.includes("補") || k.includes("藥"));
    if(!hasMedic && totalDisciples > 0) {
      warnings.push({ type: "danger", icon: SVG.gourd(), text: "後勤空虛：宗門內極度缺乏「煉丹」或「醫療」相關職業，若遇大戰恐無人救治，死傷慘重。" });
    }

    // 檢查邪修比例
    const evilCount = pathCounts["邪修"] || 0;
    if(evilCount > totalDisciples * 0.3) {
      warnings.push({ type: "warn", icon: SVG.bolt(), text: `風氣偏移：門內邪道修士高達 ${evilCount} 人，比例過高。近期須慎防正道聯盟借機發難，或引動大規模天劫降臨。` });
    }

    // 檢查單一道途過於集中 (以劍修為例)
    const swordCount = pathCounts["劍修"] || 0;
    if(swordCount > totalDisciples * 0.5) {
      warnings.push({ type: "info", icon: SVG.sword(), text: "劍氣沖霄：本門逾半數為劍修，殺伐極盛！但須注意鬥法時輔助與防禦手段恐顯單一。" });
    }

    // 都很健康的話給予正面回饋
    if(warnings.length === 0 && totalDisciples > 0) {
      warnings.push({ type: "good", icon: SVG.yinyang(), text: "陰陽調和：目前宗門百花齊放，各道途與職業分布尚稱均衡，氣運綿長，並無明顯短板。" });
    }

    const renderBoard = (list, valFn, emptyMsg, colorClass) => {
      if(list.length === 0) return `<div class="board-empty">${emptyMsg}</div>`;
      return list.map((item, i) => `
        <div class="board-row">
          <span class="board-rank">#${i+1}</span>
          <span class="board-name">${escapeHtml(item.name || "未命名")}</span>
          <span class="board-val ${colorClass}">${valFn(item)}</span>
        </div>`).join("");
    };

    return `
      <div class="report-section">
        <div class="report-section-title">天機榜 · 戰力底蘊</div>
        <div class="board-grid">
          <div class="board-card">
            <div class="board-head qi">${SVG.spark()} 靈氣巔峰榜 <span style="font-size:11px;font-weight:400;margin-left:auto;color:rgba(255,255,255,.5);">最高靈氣上限</span></div>
            <div class="board-list">${renderBoard(topQi, c => num(c.qi?.max).toLocaleString(), "尚無填寫靈氣的修士", "text-jade")}</div>
          </div>
          <div class="board-card">
            <div class="board-head hp">${SVG.drop()} 命懸一線 <span style="font-size:11px;font-weight:400;margin-left:auto;color:rgba(255,255,255,.5);">生命 ≤ 30%</span></div>
            <div class="board-list">${renderBoard(lowHp.map(x=>x.c), c => num(c.hp?.current) + " / " + num(c.hp?.max), "宗門上下目前安然無恙", "text-vermillion")}</div>
          </div>
        </div>
      </div>

      <div class="report-section">
        <div class="report-section-title">天機榜 · 善惡因果</div>
        <div class="board-grid">
          <div class="board-card">
            <div class="board-head good">${SVG.lotus()} 功德無量 <span style="font-size:11px;font-weight:400;margin-left:auto;color:rgba(255,255,255,.5);">負業力排行</span></div>
            <div class="board-list">${renderBoard(goodKarma, c => num(c.karma), "尚未發現功德顯赫之輩", "text-gold")}</div>
          </div>
          <div class="board-card">
            <div class="board-head bad">${SVG.chain()} 業障纏身 <span style="font-size:11px;font-weight:400;margin-left:auto;color:rgba(255,255,255,.5);">正業力排行</span></div>
            <div class="board-list">${renderBoard(badKarma, c => "+" + num(c.karma), "門內尚無罪孽深重之徒", "text-purple")}</div>
          </div>

      <div class="report-section">
        <div class="report-section-title">宗門氣運推演預警</div>
        <div style="margin-top:12px;">
          ${warnings.map(w => `<div class="eco-warn ${w.type}"><span class="eco-icon">${w.icon}</span><span>${w.text}</span></div>`).join("")}
        </div>
      </div>
    `;
  }


  // ===== 【本命玉牌殿】=====
  // 報名制跑團的點名板：每位角色一面墨玉本命牌，生命與靈氣鑿成凸起的刻印，
  // 血量低於三成則玉牌龜裂泛血。天道可自行排定玉牌順序（例如把本場出團的排前面）。

  // 依天道排定的順序排列，沒排到的接在後面按姓名排
  function orderedChars(){
    const pos = new Map();
    tabletOrder.forEach((id, i) => { if(!pos.has(id)) pos.set(id, i); });
    return Object.entries(chars).sort((a, b) => {
      const pa = pos.has(a[0]) ? pos.get(a[0]) : Infinity;
      const pb = pos.has(b[0]) ? pos.get(b[0]) : Infinity;
      if(pa !== pb) return pa - pb;
      return (a[1].name || "").localeCompare(b[1].name || "", "zh-Hant");
    });
  }

  function jadeTabletHtml(id, c, idx, total, sortable){
    const pct = (cur,max) => { const v=num(cur), m=num(max); return m<=0?0:Math.max(0,Math.min(100,v/m*100)); };
    // 正業力＝業障（紫），負業力＝功德（金），與角色卡一致
    const karmaColor = k => num(k) > 0 ? "#B48CF0" : (num(k) < 0 ? "#E8CA82" : "rgba(220,207,168,.6)");
    const hpPct = pct(c.hp?.current, c.hp?.max);
    const qiPct = pct(c.qi?.current, c.qi?.max);
    const shattered = num(c.hp?.max) > 0 && hpPct <= 30;
    return `
      <div class="jade-tablet${shattered ? " shattered" : ""}${sortable ? " sortable" : ""}"
        data-char="${attr(id)}" ${sortable ? `draggable="true"` : ""}>
        ${shattered ? CRACK_SVG : ""}
        ${sortable ? `<div class="jt-ord">${idx + 1}</div><div class="jt-grip">${SVG.grip()}</div>` : ""}
        <div class="jt-head">
          <span class="jt-name">${escapeHtml(c.name || "未命名角色")}</span>
          <span class="jt-realm">${escapeHtml(c.realm || "－")}</span>
        </div>
        <div class="jt-meta">${escapeHtml([c.race, c.path, c.job].filter(Boolean).join(" · ") || "－")}
          ${c.player ? `　<span class="jt-player">${escapeHtml(c.player)}</span>` : ""}</div>

        <div class="jt-line hp">
          <div class="jt-line-label">
            <span class="lbl">${SVG.drop()}生命</span>
            <span class="val">${num(c.hp?.current).toLocaleString()} / ${num(c.hp?.max).toLocaleString()}</span>
          </div>
          <div class="jt-rail"><div class="jt-flow${hpPct <= 0 ? " empty" : ""}" style="width:${hpPct.toFixed(1)}%"></div></div>
        </div>

        <div class="jt-line qi">
          <div class="jt-line-label">
            <span class="lbl">${SVG.spark()}靈氣</span>
            <span class="val">${num(c.qi?.current).toLocaleString()} / ${num(c.qi?.max).toLocaleString()}</span>
          </div>
          <div class="jt-rail"><div class="jt-flow${qiPct <= 0 ? " empty" : ""}" style="width:${qiPct.toFixed(1)}%"></div></div>
        </div>

        <div class="jt-foot">
          <span class="jt-stat">${SVG.shield()}護甲<b>${num(c.ac)}</b></span>
          <span class="jt-stat">${SVG.yinyang()}業力<b style="color:${karmaColor(c.karma)};">${num(c.karma)}</b></span>
        </div>
        ${sortable ? `<div class="jt-move">
          <button data-action="tablet-move" data-id="${attr(id)}" data-dir="-1" title="往前移" ${idx === 0 ? "disabled" : ""}>${SVG.chevronL()}</button>
          <button data-action="tablet-move" data-id="${attr(id)}" data-dir="1" title="往後移" ${idx === total - 1 ? "disabled" : ""}>${SVG.chevronR()}</button>
        </div>` : ""}
      </div>`;
  }

  function jadeGridHtml(){
    const list = orderedChars();
    const sortable = isDM();
    return list.map(([id,c], i) => jadeTabletHtml(id, c, i, list.length, sortable)).join("");
  }

  function combatHtml(){
    const list = orderedChars();
    if(list.length === 0) return `<div class="notice info" style="font-weight:400;">本命玉牌殿空無一牌，尚未有弟子刻下姓名。</div>`;
    return `
      <div class="block-title">本命玉牌殿<span class="spacer"></span>
        <span style="font-size:12px;font-weight:400;color:var(--ink-faint2);">唯讀・角色卡變動時玉牌即時感應</span>
      </div>
      ${isDM() ? `<div class="sort-hint">
        ${SVG.grip()}<span>拖曳玉牌即可調整排列，或用玉牌右下角的左右箭頭一格一格挪；順序會同步給所有人。</span>
        <span class="spacer"></span>
        <button class="btn" data-action="tablet-reset" ${tabletOrder.length ? "" : "disabled"}>${SVG.reset()}依姓名重排</button>
      </div>` : ""}
      <div class="jade-grid" id="jadeGrid">${jadeGridHtml()}</div>`;
  }

  // 只重畫玉牌區，避免整頁重繪讓捲軸跳動
  function refreshJadeGrid(){
    const grid = document.getElementById("jadeGrid");
    if(!grid) return;
    grid.innerHTML = jadeGridHtml();
    wireEvents(grid);
    wireTabletDrag(grid);
    const reset = document.querySelector('[data-action="tablet-reset"]');
    if(reset) reset.disabled = tabletOrder.length === 0;
  }

  async function saveTabletOrder(ids){
    tabletOrder = ids;
    await writeNow("tabletOrder", ids.length ? ids : null);
    refreshJadeGrid();
  }

  async function moveTablet(id, dir){
    const ids = orderedChars().map(([cid]) => cid);
    const i = ids.indexOf(id);
    const j = i + dir;
    if(i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveTabletOrder(ids);
  }

  // 拖曳排序：滑鼠拖到哪就即時插到哪，放開才寫進資料庫。
  // 觸控裝置不會觸發 HTML5 拖曳事件，所以另外保留左右箭頭那組按鈕。
  let draggingTablet = null;   // 容器層的監聽只掛一次，拖曳中的牌得放在外層共用
  function wireTabletDrag(grid){
    if(!isDM()) return;

    grid.querySelectorAll(".jade-tablet.sortable").forEach(el => {
      el.addEventListener("dragstart", e => {
        draggingTablet = el;
        el.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", el.dataset.char); }catch(_){}
      });
      el.addEventListener("dragend", async () => {
        el.classList.remove("dragging");
        grid.querySelectorAll(".drop-mark").forEach(x => x.classList.remove("drop-mark"));
        draggingTablet = null;
        await saveTabletOrder([...grid.children].map(x => x.dataset.char).filter(Boolean));
      });
    });

    // 玉牌每次重畫都會再進來一次，容器上的監聽只掛一次，免得越疊越多
    if(grid.dataset.dragWired) return;
    grid.dataset.dragWired = "1";
    grid.addEventListener("dragover", e => {
      if(!draggingTablet || draggingTablet.parentElement !== grid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const spot = nearestSlot(grid, e.clientX, e.clientY);
      if(!spot) return;
      grid.querySelectorAll(".drop-mark").forEach(x => x.classList.remove("drop-mark"));
      spot.el.classList.add("drop-mark");
      grid.insertBefore(draggingTablet, spot.before ? spot.el : spot.el.nextSibling);
    });
    grid.addEventListener("drop", e => e.preventDefault());
  }

  // 找出離游標最近的那面牌，再判斷該插在它前面還是後面
  function nearestSlot(grid, x, y){
    let best = null, bestDist = Infinity;
    grid.querySelectorAll(".jade-tablet:not(.dragging)").forEach(el => {
      const b = el.getBoundingClientRect();
      const d = Math.hypot(x - (b.left + b.width / 2), y - (b.top + b.height / 2));
      if(d < bestDist){ bestDist = d; best = el; }
    });
    if(!best) return null;
    const b = best.getBoundingClientRect();
    return { el: best, before: x < b.left + b.width / 2 };
  }


  // ===== 【領物申請與賜寶系統】=====
  // 弟子於庫房呈遞調用申請 → 內務長老於【待批核卷宗】賜下或駁回。

  function closeModal(){
    const m = document.getElementById("tfModal");
    if(m) m.remove();
    if(closeModal._esc){ document.removeEventListener("keydown", closeModal._esc); closeModal._esc = null; }
  }
  function openModal(html, onMount){
    closeModal();
    const el = document.createElement("div");
    el.className = "modal-mask"; el.id = "tfModal";
    el.innerHTML = `<div class="modal-card">${html}</div>`;
    el.addEventListener("mousedown", e => { if(e.target === el) closeModal(); });
    document.body.appendChild(el);
    closeModal._esc = e => { if(e.key === "Escape") closeModal(); };
    document.addEventListener("keydown", closeModal._esc);
    if(onMount) onMount(el);
  }

  function myChars(){
    if(!discordUser) return [];
    return Object.entries(chars)
      .filter(([,c]) => c && c.ownerId === discordUser.id)
      .sort((a,b) => (a[1].name||"").localeCompare(b[1].name||"", "zh-Hant"));

    openModal(`

        申請將送入【待批核卷宗】，待長老賜下。</div>

      <label class="modal-label">賜予何人</label>
      <select class="modal-field" id="reqChar">
        ${mine.map(([id,c]) => `<option value="${attr(id)}">${escapeHtml(c.name || "未命名角色")}${c.realm ? `　（${escapeHtml(c.realm)}）` : ""}</option>`).join("")}
      </select>

      <label class="modal-label">請求數量</label>

        const r = push(dref("itemRequests"));

        closeModal();
        flash("申請已呈入內務堂", false);

  // 從資料庫讀回角色卡的儲物袋（Firebase 可能把陣列還原成物件，統一轉回陣列）
  function readItemsList(char){
    const raw = char && char.itemsList;
    return Array.isArray(raw) ? raw.slice()
      : (raw && typeof raw === "object" ? Object.values(raw) : []);
  }

  // 賜下多寶閣法寶：不扣庫存，寫進弟子儲物袋，並把多寶閣的持有者改記過去
  async function approveTreasureRequest(reqId, req){
    const reason = req.reason || "－";
    try{
      lastLocalWriteAt = Date.now();
      const treSnap = await get(dref("treasury/" + req.itemId));
      const tre = treSnap.val();
      if(!tre){ alert(`多寶閣已無【${req.itemName || "此法寶"}】，無法賜下。`); return; }

      const holder = String(tre.holder || "").trim();
      const charName = req.charName || "未命名角色";
      if(holder && holder !== charName &&
         !confirm(`【${tre.name || req.itemName}】目前記在「${holder}」名下。\n\n仍要改賜給「${charName}」嗎？`)) return;

      const charSnap = await get(dref("characters/" + req.charId));
      const char = charSnap.val();
      if(!char){ alert(`找不到弟子「${charName}」的角色卡，可能已被刪除。`); return; }

      const desc = [
        tre.quote ? "題詞：" + tre.quote : "",
        tre.appearance ? "外觀：" + tre.appearance : "",
        tre.coreEffect ? "核心效果：" + tre.coreEffect : "",
        tre.specialEffect ? "特殊效果：" + tre.specialEffect : "",
        tre.condition ? "使用條件：" + tre.condition : "",
        tre.upgrade ? "升級：" + tre.upgrade : "",
        tre.upgradeEffect ? "升級效果：" + tre.upgradeEffect : "",
        "賜下理由：" + reason
      ].filter(Boolean).join("\n");

      const itemsList = readItemsList(char);
      itemsList.push({
        name: tre.name || req.itemName || "未命名法寶",
        type: [tre.rank, tre.type].filter(Boolean).join("・") || "多寶閣法寶",
        desc
      });

      await update(dref("treasury/" + req.itemId), { holder: charName });
      await update(dref("characters/" + req.charId), {
        itemsList,
        updatedAt: Date.now(),
        updatedBy: (discordUser && discordUser.name) || "內務堂"
      });
      if(treasury[req.itemId]) treasury[req.itemId].holder = charName;

      await writeLog(`內務長老 將 多寶閣法寶【${tre.name || req.itemName || "未命名法寶"}】 賜予 弟子 ${charName} (理由：${reason})`, null);
      await remove(dref("itemRequests/" + reqId));
      delete itemRequests[reqId];

      flash(`已賜下法寶【${tre.name || req.itemName || "法寶"}】`, false);
      renderAll(true);
    }catch(e){
      console.error("approve treasure error", e);
      flash("賜下失敗：" + (e && e.message ? e.message : e), true);
    }
  }

  // 賜下：庫房扣量 → 寫入弟子儲物袋 → 留下日誌 → 退掉卷宗
  async function approveRequest(reqId){
    const req = itemRequests[reqId];
    if(!req){ flash("此卷宗已不存在", true); return; }
    if(req.kind === "treasure") return approveTreasureRequest(reqId, req);
    const qty = Math.max(1, Math.floor(num(req.qty)));
    const reason = req.reason || "－";
    try{
      lastLocalWriteAt = Date.now();
      const itemSnap = await get(dref("warehouse/" + req.itemId));
      const item = itemSnap.val();
      if(!item){ alert(`庫房已無【${req.itemName || "此物資"}】，無法賜下。`); return; }
      const have = num(item.qty);
      if(have < qty){
        alert(`庫存不足，無法賜下。\n\n【${item.name || req.itemName}】現存 ${have}，申請 ${qty}。`);
        return;
      }

      const charSnap = await get(dref("characters/" + req.charId));
      const char = charSnap.val();
      if(!char){ alert(`找不到弟子「${req.charName || "未命名"}」的角色卡，可能已被刪除。`); return; }

      const itemsList = readItemsList(char);
      itemsList.push({
        name: req.itemName || "未命名物資",
        type: "宗門調用",
        desc: "數量: " + qty + "。理由: " + reason
      });

      await update(dref("warehouse/" + req.itemId), { qty: have - qty });
      await update(dref("characters/" + req.charId), {
        itemsList,
        updatedAt: Date.now(),
        updatedBy: (discordUser && discordUser.name) || "內務堂"
      });
      if(warehouse[req.itemId]) warehouse[req.itemId].qty = have - qty;

      await writeLog(`內務長老 將 【${req.itemName || "未命名物資"} x${qty}】 賜予 弟子 ${req.charName || "未命名角色"} (理由：${reason})`, -qty);
      await remove(dref("itemRequests/" + reqId));
      delete itemRequests[reqId];

      flash(`已賜下【${req.itemName || "物資"} x${qty}】`, false);
      renderAll(true);
    }catch(e){
      console.error("approve error", e);
      flash("賜下失敗：" + (e && e.message ? e.message : e), true);
    }
  }

  // 駁回：僅退回卷宗，並在日誌留下一筆備查

  // ===== 基礎資料匯入（弟子花名冊 / 倉儲物資）=====
  // 種子資料放在 seed-data.js，匯入後一切以資料庫為準，網站上的編輯不會回寫檔案。
  const rosterKey = m => (m.rank || "記名") + "／" + String(m.name || "").trim();
  const whKey = w => (w.category || "丹藥") + "／" + String(w.name || "").trim();

  function pendingRoster(){
    const have = new Set(Object.values(roster).map(rosterKey));
    return ROSTER_SEED.filter(m => !have.has(rosterKey(m)));
  }
  function pendingWarehouse(){
    const have = new Set(Object.values(warehouse).map(whKey));
    return WAREHOUSE_SEED.filter(w => !have.has(whKey(w)));
  }
  // 設施以「名稱」為準，已經有同名建築就略過；門派卷宗本身只在完全空白時才寫入
  function pendingFacilities(){
    const have = new Set(Object.values(facilities).map(f => String((f && f.name) || "").trim()));
    return FACILITY_SEED.filter(f => !have.has(f.name));
  }
  function sectIsEmpty(){ return !sect || Object.keys(sect).length === 0; }

  // 一次 update() 寫進去，避免上百筆各自往返
  async function importSeed(kind, btn){
    const isRoster = kind === "roster";
    const rows = isRoster ? pendingRoster() : pendingWarehouse();
    const noun = isRoster ? "位弟子" : "項物資";
    if(rows.length === 0){ flash(isRoster ? "花名冊已經是最新的了" : "倉儲已經是最新的了", false); return; }
    if(!confirm(`要匯入 ${rows.length} ${noun}嗎？\n\n已存在的條目會自動略過，現有資料不會被覆蓋。`)) return;

    const payload = {};
    rows.forEach(row => { payload[push(dref(kind === "roster" ? "roster" : "warehouse")).key] = row; });
    btn.disabled = true;
    try{
      lastLocalWriteAt = Date.now();
      await update(dref(isRoster ? "roster" : "warehouse"), payload);
      Object.assign(isRoster ? roster : warehouse, payload);
      await writeLog(`匯入${isRoster ? "弟子花名冊" : "倉儲物資"} ${rows.length} 筆`, null);
      flash(`已匯入 ${rows.length} ${noun}`, false);
      renderAll(true);
    }catch(e){
      console.error("import error", e);
      flash("匯入失敗：" + (e && e.message ? e.message : e), true);
      btn.disabled = false;
    }
  }

  // 設施與門派卷宗一起匯入：建築逐座比對名稱略過重複，門派卷宗只在空白時才寫。
  async function importFacilities(btn){
    const rows = pendingFacilities();
    const withSect = sectIsEmpty();
    if(rows.length === 0 && !withSect){ flash("宗門設施已經是最新的了", false); return; }
    const what = [rows.length ? `${rows.length} 座建築` : "", withSect ? "門派卷宗" : ""].filter(Boolean).join("與");
    if(!confirm(`要匯入${what}嗎？\n\n同名的建築會自動略過，現有資料不會被覆蓋。`)) return;

    const payload = {};
    rows.forEach(row => { payload[push(dref("facilities")).key] = row; });
    btn.disabled = true;
    try{
      lastLocalWriteAt = Date.now();
      if(rows.length) await update(dref("facilities"), payload);
      if(withSect) await set(dref("sect"), SECT_SEED);
      Object.assign(facilities, payload);
      if(withSect) sect = JSON.parse(JSON.stringify(SECT_SEED));
      await writeLog(`匯入宗門設施：${what}`, null);
      flash(`已匯入${what}`, false);
      renderAll(true);
    }catch(e){
      console.error("import facilities error", e);
      flash("匯入失敗：" + (e && e.message ? e.message : e), true);
      btn.disabled = false;
    }
  }

  // ===== 事件綁定 =====
  // 切換子分類／階級／搜尋時，只換掉那一張表格；
  // 以前是整個 mainArea 重畫，捲軸與分頁動畫都會重來，畫面看起來就會整個跳一下。
  // 換表格時把「分類列」釘在原本的螢幕位置上：表格長短不同會讓頁面高度改變，
  // 不補正的話畫面會自己往上滑一段，看起來就是使用者說的「整個跳動」。
  function keepAnchored(anchorSel, fn){
    const anchor = document.querySelector(anchorSel);
    const before = anchor ? anchor.getBoundingClientRect().top : null;
    fn();
    if(anchor){
      const after = anchor.getBoundingClientRect().top;
      if(Math.abs(after - before) > 1) window.scrollBy(0, after - before);
    }
  }
  // 換表格時把高度變化做成 0.22 秒的過場：不同分類的筆數差很多，
  // 直接抽換的話頁面高度會瞬間縮一大段，畫面就像被扯了一下。
  function swapTable(wrap, html){
    const from = wrap.getBoundingClientRect().height;
    wrap.classList.remove("swap-in");
    wrap.innerHTML = html;
    wireEvents(wrap);
    const to = wrap.getBoundingClientRect().height;
    void wrap.offsetWidth;          // 強制重排，動畫才會重播
    wrap.classList.add("swap-in");
    if(Math.abs(to - from) > 4){
      wrap.style.height = from + "px";
      requestAnimationFrame(() => {
        wrap.style.transition = "height .22s ease";
        wrap.style.height = to + "px";
      });
      clearTimeout(swapTable._t);
      swapTable._t = setTimeout(() => { wrap.style.height = ""; wrap.style.transition = ""; }, 280);
    }
  }
  function refreshWarehouseTable(){
    const wrap = document.getElementById("whTableWrap");
    if(!wrap) return;
    keepAnchored("#tab-warehouse .sub-tabs", () => swapTable(wrap, warehouseTableHtml(canEdit())));
  }
  function refreshRosterTable(){
    const wrap = document.getElementById("rosterTableWrap");
    if(!wrap) return;
    keepAnchored("#tab-roster .sub-tabs", () => swapTable(wrap, rosterTableHtml(canEdit())));
  }
  function paintRealmChip(){
    const chip = document.getElementById("realmFilterChip");
    const text = document.getElementById("realmFilterText");
    if(!chip || !text) return;
    text.textContent = rosterRealmFilter ? `只看境界【${rosterRealmFilter}】` : "";
    chip.style.display = rosterRealmFilter ? "inline-flex" : "none";
  }

  function refreshCounts(){
    document.querySelectorAll("[data-cat]").forEach(b => {
      const c = b.dataset.cat;
      b.textContent = `${c}（${Object.values(warehouse).filter(i => (i.category||"丹藥") === c).length}）`;
    });
    const all = rosterEntries();
    document.querySelectorAll("[data-rank]").forEach(b => {
      const r = b.dataset.rank;

  // 實際套用一筆靈石增減（快速按鈕／自訂輸入都直接呼叫，不再另外跳二次確認——
  // 按錯了馬上按對應的反向數字就能抵銷，靠下面的「復原上一筆」保底），跟直接改
  // 數字欄共用同一套 before/after 記錄與日誌格式。
  async function applyStoneDelta(key, delta){
    if(!delta) return false;
    const before = num(stones[key]);
    const after = Math.max(0, before + delta);
    if(after === before) return false;
    stones[key] = after;
    const label = (STONE_KEYS.find(s => s.k === key) || {}).label || key;
    const ok = await writeNow("stones/" + key, after);
    if(ok){
      writeLog(`${label} ${before.toLocaleString()} ➔ ${after.toLocaleString()}`, after - before);
      lastStoneChange = { key, before, after };
      const box = document.querySelector(`input[data-stone="${key}"]`);
      if(box) box.value = after;
      refreshStoneUndo();
      renderHallStats();
    }
    return ok;
  }

  // 結算設施開銷：可能同時動到好幾個等級的靈石，所以不用只認單一鍵的
  // applyStoneDelta／lastStoneChange，改記在 lastSettle 裡，撤銷時一次還原全部。
  // 流水帳只留一筆有意義的摘要（「結算本月設施消耗：中品靈石 1,000、下品靈石 37,000」），
  // 不是每個等級各記一筆把近期流水灌爆。
  let lastSettle = null;   // { label, entries:[{ key, before, after }] }
  async function settleStones(items, label){
    const summary = items.map(i => `${gradeLabel(i.key)} ${i.qty.toLocaleString()}`).join("、");
    // applyStoneDelta 一向是扣到 0 為止（不會出現負數庫存），這裡沿用同一套規則，
    // 但庫藏不夠時要先講清楚：扣完只會歸零，差額等於沒扣到。
    const short = items.filter(i => num(stones[i.key]) < i.qty);
    const warn = short.length
      ? `\n\n注意：${short.map(i => `${gradeLabel(i.key)}只有 ${num(stones[i.key]).toLocaleString()}`).join("、")}，`
        + "不足的部分只會扣到 0 為止，差額請自行記帳。"
      : "";
    if(!confirm(`${label}？\n\n將從庫藏扣除：${summary}${warn}`)) return false;

    const entries = [];
    for(const i of items){
      const before = num(stones[i.key]);
      const after = Math.max(0, before - i.qty);
      if(after === before) continue;
      stones[i.key] = after;
      if(!await writeNow("stones/" + i.key, after)) return false;
      entries.push({ key:i.key, before, after });
      const box = document.querySelector(`input[data-stone="${i.key}"]`);
      if(box) box.value = after;
    }
    if(entries.length === 0){ flash("庫藏已經是 0，沒有可扣的靈石", false); return false; }
    await writeLog(`${label}：${summary}`, null);
    lastSettle = { label, entries };
    lastStoneChange = null;   // 「復原上一筆」管的是單筆增減，這次結算由下面的撤銷鈕負責
    refreshStoneUndo();
    flash(`${label}已完成`, false);
    renderAll(true);
    return true;
  }

  function wireEvents(area){
    // 分類 / 階級 / 搜尋
    area.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
      warehouseCat = b.dataset.cat;
      document.querySelectorAll("[data-cat]").forEach(x => x.classList.toggle("active", x === b));
      refreshWarehouseTable();
    });
    area.querySelectorAll("[data-rank]").forEach(b => b.onclick = () => {
      rosterRank = b.dataset.rank;
      document.querySelectorAll("[data-rank]").forEach(x => x.classList.toggle("active", x === b));
      refreshRosterTable();
    });
    const search = area.querySelector("#rosterSearch");
    if(search){
      search.oninput = () => { rosterFilter = search.value; refreshRosterTable(); };
    }
    const sortSel = area.querySelector("#rosterSort");
    if(sortSel) sortSel.onchange = () => { rosterSort = sortSel.value; refreshRosterTable(); };

    // 境界統計卡＝名冊的境界篩選器；再點同一張就取消
    area.querySelectorAll("[data-realm-pick]").forEach(card => card.onclick = () => {
      const g = card.dataset.realmPick;
      rosterRealmFilter = rosterRealmFilter === g ? "" : g;
      document.querySelectorAll("[data-realm-pick]").forEach(x => {
        x.classList.toggle("on", !!rosterRealmFilter && x.dataset.realmPick === rosterRealmFilter);
      });
      paintRealmChip();
      refreshRosterTable();
    });
    const chipClear = area.querySelector("#realmFilterClear");
    if(chipClear) chipClear.onclick = () => {
      rosterRealmFilter = "";
      document.querySelectorAll("[data-realm-pick]").forEach(x => x.classList.remove("on"));
      paintRealmChip();
      refreshRosterTable();
    };

    // 靈石：直接改數字（快速增減按鈕另外走 stone-quick / stone-custom action）
    area.querySelectorAll("input[data-stone]").forEach(input => {
      const key = input.dataset.stone;
      const before = num(stones[key]);
      input.onchange = async () => {
        const after = num(input.value);
        if(after === before) return;
        stones[key] = after;
        const label = (STONE_KEYS.find(s => s.k === key) || {}).label || key;
        if(await writeNow("stones/" + key, after)){
          writeLog(`${label} ${before.toLocaleString()} ➔ ${after.toLocaleString()}`, after - before);
          lastStoneChange = { key, before, after };
          refreshStoneUndo();
        }
      };
    });

    // 庫房欄位
    area.querySelectorAll("[data-w]").forEach(input => {
      const id = input.dataset.w, prop = input.dataset.prop;
      if(input.dataset.qty){
        const before = num(warehouse[id] && warehouse[id].qty);
        input.onchange = async () => {
          const after = num(input.value);
          if(warehouse[id]) warehouse[id].qty = after;
          if(await writeNow(`warehouse/${id}/qty`, after) && after !== before){
            writeLog(`${(warehouse[id]||{}).name || "物資"} 數量 ${before} ➔ ${after}`, after - before);
          }
        };
      } else {
        input.oninput = () => {
          if(warehouse[id]) warehouse[id][prop] = input.value;
          scheduleSave(`warehouse/${id}/${prop}`, input.value);
        };
      }
    });

    // 多寶閣欄位
    area.querySelectorAll("[data-t]").forEach(input => {
      const id = input.dataset.t, prop = input.dataset.prop;
      const handler = () => {
        if(treasury[id]) treasury[id][prop] = input.value;
        scheduleSave(`treasury/${id}/${prop}`, input.value);
      };
      if(input.tagName === "SELECT") input.onchange = handler; else input.oninput = handler;
    });

    // 門派卷宗欄位
    area.querySelectorAll("[data-s]").forEach(input => {
      const prop = input.dataset.s;
      input.oninput = () => {
        // 敵對勢力在畫面上是一行頓號分隔的字串，存進資料庫還原成陣列
        const value = prop === "enemies"
          ? input.value.split(/[、,，]+/).map(x => x.trim()).filter(Boolean)
          : (prop === "reputation" ? num(input.value) : input.value);
        sect[prop] = value;
        scheduleSave(`sect/${prop}`, value);
        renderHallStats();      // 上方橫幅即時跟著改
      };
    });

    // 殿宇建築欄位
    area.querySelectorAll("[data-f]").forEach(input => {
      const id = input.dataset.f, prop = input.dataset.prop;
      const handler = () => {
        const value = (prop === "upkeepQty" || prop === "capNow" || prop === "capMax") ? num(input.value) : input.value;
        if(facilities[id]) facilities[id][prop] = value;
        scheduleSave(`facilities/${id}/${prop}`, value);
        // 開銷相關的欄位一改，上方橫幅和結算區的數字都要重算
        if(prop === "upkeepQty" || prop === "upkeepGrade" || prop === "upkeepKind"){
          renderHallStats();    // 上方橫幅的每月開銷／可支撐月數要跟著重算
          if(prop === "upkeepKind") renderAll(true);   // 每月／單次／不需靈石會換掉整張卡的欄位
        }
      };
      if(input.tagName === "SELECT") input.onchange = handler; else input.oninput = handler;
    });

    // 信物索引＝建築篩選器，再點同一個就取消
    area.querySelectorAll("[data-token-pick]").forEach(chip => chip.onclick = () => {
      const t = chip.dataset.tokenPick;
      tokenFilter = (t && tokenFilter === t) ? "" : t;
      renderAll(true);
    });

    // 花名冊欄位
    area.querySelectorAll("[data-r]").forEach(input => {
      const id = input.dataset.r, prop = input.dataset.prop;
      const handler = () => {
        if(roster[id]) roster[id][prop] = input.value;
        scheduleSave(`roster/${id}/${prop}`, input.value);
        // 改姓名可能讓這一列跟某張角色卡連動（或不再連動），境界欄也要重畫
        if(prop === "realm" || prop === "rank" || prop === "name"){
          // 境界統計與分頁計數要跟著更新，但延後到使用者離開輸入框再重繪
          clearTimeout(wireEvents._statTimer);
          wireEvents._statTimer = setTimeout(() => {
            if(document.activeElement !== input){ refreshCounts(); renderAll(true); }
          }, 1200);
        }
      };
      if(input.tagName === "SELECT") input.onchange = () => { handler(); refreshCounts(); refreshRosterTable(); };
      else input.oninput = handler;
    });

    // 按鈕
    area.querySelectorAll("[data-action]").forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;

        if(action === "copy-uid" && discordUser){
          navigator.clipboard?.writeText(discordUser.id).then(()=>flash("玉簡 ID 已複製", false)).catch(()=>{});
          return;
        }
        if(action === "claim-dm"){
          if(!discordUser) return;
          if(Object.keys(admins).length > 0){ flash("已有管理員，無法自行取得天道權限", true); return; }
          await writeNow("admins/" + discordUser.id, { role:"DM", name: discordUser.name });
          renderAll(true);
          return;
        }

        // 沙盒模式：僅供啟用者本人試用，跟真實資料完全隔離
        if(action === "claim-sandbox"){
          if(!discordUser) return;
          if(sandboxOwner){ flash("沙盒模式已經有人啟用了", true); return; }
          btn.disabled = true;
          try{
            await set(ref(db, "sandboxOwner"), { id: discordUser.id, name: discordUser.name });
            await seedSandboxFromReal(discordUser.id);
            setSandboxOn(true);
            flash("沙盒模式已啟用，資料已複製一份真實快照", false);
          }catch(e){
            console.error("claim sandbox error", e);
            explainSandboxPermissionError(e);
            btn.disabled = false;
          }
          return;
        }
        if(action === "sandbox-on"){
          if(!(discordUser && sandboxOwner && sandboxOwner.id === discordUser.id)) return;
          setSandboxOn(true);
          return;
        }
        if(action === "sandbox-off"){
          setSandboxOn(false);
          return;
        }
        if(action === "sandbox-reset"){
          if(!sandboxActive()) return;
          if(!confirm("要清掉目前的沙盒資料，重新複製一份最新的真實快照嗎？\n\n沙盒裡目前的測試內容將會被覆蓋。")) return;
          btn.disabled = true;
          try{
            await seedSandboxFromReal(discordUser.id);
            flash("沙盒資料已重置", false);
            renderAll(true);
          }catch(e){
            console.error("reset sandbox error", e);
            flash("重置失敗：" + (e && e.message ? e.message : e), true);
            btn.disabled = false;
          }
          return;
        }
        if(action === "sandbox-release"){
          if(!(discordUser && sandboxOwner && sandboxOwner.id === discordUser.id)) return;
          if(!confirm("確定放棄沙盒模式持有人身分？\n\n放棄後沙盒功能會回到「尚未有人啟用」的狀態，之後可以再次啟用（會是全新的一份快照）。")) return;
          try{
            await remove(ref(db, "sandboxOwner"));
            setSandboxOn(false);
          }catch(e){
            console.error("release sandbox error", e);
            flash("放棄失敗：" + (e && e.message ? e.message : e), true);
          }
          return;
        }

        if(action === "import-roster" || action === "import-warehouse"){
          if(!isDM()){ flash("只有天道可以匯入基礎資料", true); return; }
          await importSeed(action === "import-roster" ? "roster" : "warehouse", btn);
          return;
        }
        if(action === "import-facilities"){
          if(!isDM()){ flash("只有天道可以匯入基礎資料", true); return; }
          await importFacilities(btn);
          return;
        }
        if(action === "grant"){
          const id = (document.getElementById("newAdminId").value || "").trim();
          const name = (document.getElementById("newAdminName").value || "").trim();
          const role = document.getElementById("newAdminRole").value;
          if(!/^\d{5,}$/.test(id)){ flash("請貼上正確的 Discord 使用者 ID（純數字）", true); return; }
          await writeNow("admins/" + id, { role, name: name || "未命名" });
          renderAll(true);
          return;
        }
        if(action === "revoke" || action === "revoke-self"){
          const uid = action === "revoke-self" ? (discordUser && discordUser.id) : btn.dataset.id;
          if(!uid) return;
          const isMe = !!(discordUser && uid === discordUser.id);
          if(isMe){
            const isLast = Object.keys(admins).length <= 1;
            const msg = isLast
              ? "確定移除自己的權限？\n\n你是目前唯一的管理員，移除後宗門大殿會回到「尚未設定任何管理員」狀態，"
                + "畫面上會重新出現「將我設為天道」按鈕，你隨時可以再取回權限。"
              : "確定移除自己的權限？\n\n移除後你將變回唯讀的弟子身分，"
                + "若要再取得權限，需請其他天道重新授權給你。";
            if(!confirm(msg)) return;
          } else {
            if(!confirm("確定撤銷此人的管理權限？")) return;
          }
          await writeNow("admins/" + uid, null);
          if(isMe) activeTab = "tab-warehouse"; // 權限管理分頁即將消失，先切回庫房避免停在空白分頁
          renderAll(true);
          return;
        }

        // 弟子：領物申請（不需編輯權限）
        if(action === "request-item"){
          openRequestModal(btn.dataset.id);
          return;
        }

        // 玉牌排序：只有天道能排
        if(action === "tablet-move" || action === "tablet-reset"){
          if(!isDM()){ flash("只有天道可以調整玉牌排列", true); return; }
          btn.disabled = true;
          if(action === "tablet-reset"){
            if(confirm("要清掉目前的玉牌排列，改回依姓名排序嗎？")) await saveTabletOrder([]);
            else btn.disabled = false;
          } else {
            await moveTablet(btn.dataset.id, parseInt(btn.dataset.dir, 10) || 0);
          }
          return;
        }

        if(!canEdit()) return;

        // 長老：批核卷宗
        if(action === "approve-req"){
          btn.disabled = true;
          await approveRequest(btn.dataset.id);
          btn.disabled = false;
          return;
        }
        if(action === "reject-req"){
          btn.disabled = true;
          await rejectRequest(btn.dataset.id);
          btn.disabled = false;
          return;
        }

        if(action === "add-item"){
          const r = push(dref("warehouse"));
          const fresh = { category: warehouseCat, name:"", qty:0, effect:"" };
          warehouse[r.key] = fresh;
          await writeNow("warehouse/" + r.key, fresh);
          writeLog(`於【${warehouseCat}】新增一筆品項`, null);
          refreshWarehouseTable(); refreshCounts(); renderHallStats();
        }
        if(action === "del-item"){
          const it = warehouse[btn.dataset.id] || {};
          if(!confirm(`確定刪除「${it.name || "此品項"}」？`)) return;
          delete warehouse[btn.dataset.id];
          await writeNow("warehouse/" + btn.dataset.id, null);
          writeLog(`刪除品項「${it.name || "未命名"}」（原數量 ${num(it.qty)}）`, -num(it.qty));
          refreshWarehouseTable(); refreshCounts(); renderHallStats();
        }
        if(action === "qty"){
          const id = btn.dataset.id, step = parseInt(btn.dataset.step, 10) || 0;
          const it = warehouse[id]; if(!it) return;
          const before = num(it.qty), after = Math.max(0, before + step);
          // 數量已經是 0 還按減號時 after === before，這時不該白寫一次資料庫，
          // 也不該在異動日誌與近期流水留下「0 ➔ 0」這種沒有意義的紀錄。
          if(after === before) return;
          it.qty = after;
          if(await writeNow(`warehouse/${id}/qty`, after)){
            writeLog(`${it.name || "物資"} 數量 ${before} ➔ ${after}`, after - before);
          }
          const box = document.querySelector(`input[data-w="${id}"][data-qty]`);
          if(box) box.value = after;
          renderHallStats();
        }

        // 靈石快速增減：直接套用，不跳二次確認——按錯了馬上按對應的反向數字
        // 抵銷就好，二次確認反而妨礙連續點擊；保底靠下面的「復原上一筆」。
        if(action === "stone-quick"){
          const key = btn.dataset.stone;
          const delta = parseInt(btn.dataset.delta, 10) || 0;
          if(!delta) return;
          const label = (STONE_KEYS.find(s => s.k === key) || {}).label || key;
          const signTxt = delta > 0 ? "+" : "";
          if(delta < 0 && num(stones[key]) <= 0){ flash(`${label} 已經是 0，扣不下去`, true); return; }
          const ok = await applyStoneDelta(key, delta);
          if(ok) flash(`已套用：${label} ${signTxt}${delta.toLocaleString()}`, false);
          else flash("寫入失敗，請再試一次", true);
          return;
        }
        if(action === "stone-custom"){
          const key = btn.dataset.stone;
          const label = (STONE_KEYS.find(s => s.k === key) || {}).label || key;
          const before = num(stones[key]);
          const input = prompt(`${label}　自訂增減（正數增加、負數減少，目前 ${before.toLocaleString()}）：`);
          if(input === null) return;
          const d = parseInt(input, 10) || 0;
          if(!d) return;
          if(d < 0 && before <= 0){ flash(`${label} 已經是 0，扣不下去`, true); return; }
          const ok = await applyStoneDelta(key, d);
          if(ok) flash(`已套用：${label} ${d > 0 ? "+" : ""}${d.toLocaleString()}`, false);
          else flash("寫入失敗，請再試一次", true);
          return;
        }
        if(action === "stone-undo"){
          if(!lastStoneChange) return;
          const { key, before, after } = lastStoneChange;
          if(num(stones[key]) !== after &&
             !confirm("這筆靈石在復原前又被改過，仍要復原成上一筆變動之前的數字嗎？")) return;
          const label = (STONE_KEYS.find(s => s.k === key) || {}).label || key;
          stones[key] = before;
          if(await writeNow("stones/" + key, before)){
            writeLog(`復原：${label} ${after.toLocaleString()} ➔ ${before.toLocaleString()}`, before - after);
            lastStoneChange = null;
            const box = document.querySelector(`input[data-stone="${key}"]`);
            if(box) box.value = before;
            refreshStoneUndo();
            renderHallStats();
            flash("已復原", false);
          }
          return;
        }

        if(action === "add-treasure"){
          const r = push(dref("treasury"));
          await writeNow("treasury/" + r.key, { name:"", quote:"", rank:"", type:"", holder:"", appearance:"", coreEffect:"", specialEffect:"", condition:"", upgrade:"", upgradeEffect:"" });
          renderAll(true);
        }
        if(action === "del-treasure"){
          const t = treasury[btn.dataset.id] || {};
          if(!confirm(`確定刪除法寶「${t.name || "未命名"}」？`)) return;
          await writeNow("treasury/" + btn.dataset.id, null);
          renderAll(true);
        }
        // ===== 山門殿宇 =====
        if(action === "add-facility"){
          const r = push(dref("facilities"));
          const fresh = { name:"", level: sectField("level", ""), spec:"", fn:"",
            upkeepKind:"month", upkeepGrade:"mid", upkeepQty:0,
            tokens:[], limit:"", capNow:null, capMax:null, capUnit:"" };
          facilities[r.key] = fresh;
          await writeNow("facilities/" + r.key, fresh);
          renderAll(true);
        }
        if(action === "del-facility"){
          const f = facilities[btn.dataset.id] || {};
          if(!confirm(`確定拆除「${f.name || "此建築"}」？\n\n這一座的規格、功能與開銷都會從宗門卷宗上抹去。`)) return;
          delete facilities[btn.dataset.id];
          await writeNow("facilities/" + btn.dataset.id, null);
          renderAll(true);
        }
        if(action === "edit-tokens"){
          const id = btn.dataset.id;
          const f = facilities[id];
          if(!f) return;
          const cur = toList(f.tokens).join("、");
          const next = prompt(`「${f.name || "此建築"}」的進入信物（用頓號分隔，留空表示不需信物）：`, cur);
          if(next === null) return;
          const arr = next.split(/[、,，]+/).map(x => x.trim()).filter(Boolean);
          f.tokens = arr;
          await writeNow(`facilities/${id}/tokens`, arr);
          renderAll(true);
        }

        // 結算每月開銷／單次消耗，都走同一個 settleStones()
        if(action === "settle-upkeep"){
          const need = upkeepTotals("month");
          const owe = STONE_KEYS.filter(x => need[x.k] > 0).map(x => ({ key:x.k, qty:need[x.k] }));
          if(owe.length === 0){ flash("目前沒有任何每月開銷", false); return; }
          await settleStones(owe, "結算本月設施消耗");
        }
        if(action === "settle-once"){
          const f = facilities[btn.dataset.id];
          if(!f) return;
          const qty = num(f.upkeepQty), grade = f.upkeepGrade || "mid";
          if(qty <= 0){ flash("這座建築沒有設定單次消耗", false); return; }
          await settleStones([{ key:grade, qty }], `開啟 ${f.name || "建築"} 一次`);
        }
        if(action === "undo-settle"){
          if(!lastSettle) return;
          if(!confirm(`撤銷「${lastSettle.label}」？\n\n${lastSettle.entries
            .map(e => `${gradeLabel(e.key)} ${num(stones[e.key]).toLocaleString()} ➔ ${e.before.toLocaleString()}`).join("\n")}`)) return;
          for(const e of lastSettle.entries){
            stones[e.key] = e.before;
            await writeNow("stones/" + e.key, e.before);
            const box = document.querySelector(`input[data-stone="${e.key}"]`);
            if(box) box.value = e.before;
          }
          await writeLog(`撤銷：${lastSettle.label}`, null);
          lastSettle = null;
          flash("已撤銷這次結算", false);
          renderAll(true);
        }

        if(action === "add-member"){
          const r = push(dref("roster"));
          const fresh = { name:"", rank: rosterRank === "全部" ? "記名" : rosterRank, title:"", root:"", job:"", path:"", realm:"", master:"" };
          roster[r.key] = fresh;
          await writeNow("roster/" + r.key, fresh);
          refreshRosterTable(); refreshCounts(); renderHallStats();
        }
        if(action === "del-member"){
          const m = roster[btn.dataset.id] || {};
          if(!confirm(`確定將「${m.name || "此弟子"}」移出花名冊？`)) return;
          delete roster[btn.dataset.id];
          await writeNow("roster/" + btn.dataset.id, null);
          refreshRosterTable(); refreshCounts(); renderHallStats();
        }
        // 境界連動：解除後這一列改回自己填，重新連動則以同名角色卡為準
        if(action === "unlink-realm" || action === "relink-realm"){
          const rid = btn.dataset.id;
          const m = roster[rid];
          if(!m) return;
          if(action === "unlink-realm"){
            // 解除當下把角色卡上的境界抄進來當起點，才不會突然變成空白
            const cur = memberRealm(m);
            m.realmLink = "manual";
            if(cur) m.realm = cur;
            await writeNow("roster/" + rid, m);
            flash(`「${m.name || "此弟子"}」的境界改為手動填寫`, false);
          } else {
            m.realmLink = "auto";
            await writeNow("roster/" + rid, m);
            flash(`「${m.name || "此弟子"}」的境界已改回跟角色卡連動`, false);
          }
          renderAll(true);   // 上面的境界統計卡也要跟著重算，不能只換表格
        }
      };
    });
  }

  initDiscordAuth();
</script>
</body>
</html>
