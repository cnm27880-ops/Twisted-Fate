<!-- 繁簡切換獨立一個 module，不跟下面連 Firebase 的那個共用同一份 import 圖：
     ES module 的靜態 import 只要有一個載入失敗，整個 module 都不會執行，
     繁簡切換明明跟 Firebase 無關，不該被 CDN 連不上的問題一起拖垮。 -->
<script type="module">
  import { initScriptMode } from "./script-mode.js";
  initScriptMode();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, get, set, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCLWbjKkxNLXF9N1iUftxhla1aiV2x3rU",
    authDomain: "twisted-fate-trpg.firebaseapp.com",
    databaseURL: "https://twisted-fate-trpg-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "twisted-fate-trpg",
    storageBucket: "twisted-fate-trpg.firebasestorage.app",
    messagingSenderId: "804781497200",
    appId: "1:804781497200:web:9e6a61e81ead31ba994db5"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  signInAnonymously(auth).catch(err => console.warn("匿名登入失敗", err));

  const DISCORD_CLIENT_ID = "1539477128242798612";
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const DISCORD_TOKEN_KEY = "tf_discord_token";

  const sheetEl = document.getElementById("sheet");
  let discordUser = null;

  function discordLogin(){
    if(!DISCORD_CLIENT_ID || DISCORD_CLIENT_ID === "YOUR_DISCORD_CLIENT_ID"){
      alert("尚未設定 Discord 登入。"); return;
    }
    const url = new URL("https://discord.com/oauth2/authorize");
    url.searchParams.set("client_id", DISCORD_CLIENT_ID);
    url.searchParams.set("redirect_uri", REDIRECT_URI);
    url.searchParams.set("response_type", "token");
    url.searchParams.set("scope", "identify");
    window.location.href = url.toString();
  }

  function discordLogout(){
    if(dirty) doSave();
    localStorage.removeItem(DISCORD_TOKEN_KEY);
    discordUser = null;
    draft = null; draftId = null; dirty = false;
    renderAuth(); renderCharLists(); renderSheet();
  }

  async function fetchDiscordUser(token){
    const res = await fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + token } });
    if(!res.ok) throw new Error("discord auth failed");
    const u = await res.json();
    let avatarUrl = u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64` : `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id) >> 22n) % 6n)}.png`;
    return { id: u.id, name: u.global_name || u.username, avatarUrl };
  }

  async function initDiscordAuth(){
    if(window.location.hash.includes("access_token")){
      const params = new URLSearchParams(window.location.hash.slice(1));
      const token = params.get("access_token");
      if(token){ localStorage.setItem(DISCORD_TOKEN_KEY, token); history.replaceState(null, "", REDIRECT_URI); }
    }
    const token = localStorage.getItem(DISCORD_TOKEN_KEY);
    if(!token) { renderAuth(); return; }
    try{ discordUser = await fetchDiscordUser(token); }
    catch(e){ localStorage.removeItem(DISCORD_TOKEN_KEY); discordUser = null; }
    if(autoPickChar()) adoptDraft();
    renderAuth(); renderCharLists(); renderSheet();
  }

  function renderAuth(){
    document.querySelector(".auth-logged-out").style.display = discordUser ? "none" : "block";
    document.getElementById("authLoggedIn").style.display = discordUser ? "flex" : "none";
    document.getElementById("btnNewChar").style.display = discordUser ? "inline-flex" : "none";
    if(discordUser){
      document.getElementById("authAvatar").src = discordUser.avatarUrl;
      document.getElementById("authName").textContent = discordUser.name;
    }
    updateDeleteBtn();
  }

  document.getElementById("discordLoginBtn").addEventListener("click", discordLogin);
  document.getElementById("discordLogoutBtn").addEventListener("click", discordLogout);

  let allChars = {};
  let currentCharId = null;
  let draft = null, draftId = null;
  let dirty = false, saving = false;
  let charsSyncError = null;
  let activeTab = "tab-main";

  const ATTRS = [
    { id:"pot", name:"根骨", en:"POT" }, { id:"int", name:"悟性", en:"INT" },
    { id:"con", name:"抗性", en:"CON" }, { id:"per", name:"神識", en:"PER" },
    { id:"luk", name:"氣運", en:"LUK" }, { id:"cha", name:"魅力", en:"CHA" }
  ];
  const PATH_TINTS = { "散修": "140,107,39", "邪修": "124,58,237", "體修": "180,95,42", "毒修": "45,120,96", "劍修": "90,120,145", "佛修": "205,168,74", "巫修": "72,58,128", "術修": "42,66,112", "音修": "196,110,122" };

  function num(v){ return Number(v) || 0; }
  function clone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function mod(val){ return Math.floor((num(val) - 10) / 2); }
  function fmtMod(n){ return (n >= 0 ? "+" : "") + n; }
  function pct(res){ const cur = num(res && res.current), max = num(res && res.max); return max<=0 ? 0 : Math.max(0, Math.min(100, (cur/max)*100)); }
  function attr(s){ return escapeHtml(s==null?"":String(s)); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  
  function toArray(val){
    if (Array.isArray(val)) return val;
    if (val && typeof val === "object") return Object.values(val);
    return [];
  }

  function blankCharacter(ownerId, ownerName){
    return normalizeChar({
      ownerId, ownerName, name: "未命名角色", player: ownerName || "", title: "",
      race: "", path: "", job: "", root: "", realm: "", karma: 0, portrait: "", pb: 2,
      ac: 10, speed: 30, hp: { current: 10, max: 10 }, hpTemp: 0, qi: { current: 10, max: 10 }, qiBase: 0,
      languages: "", skills: "", notes: "",
      quickActions: [], spellGroups: [{ groupName: "主要功法", spells: [] }],
      notes_race: "", notes_path: "", notes_job: "", itemsList: [], notesList: [], backgroundText: "",
      updatedAt: Date.now(), updatedBy: ownerName || ""
    });
  }

  function padRow(row, n){
    const out = [];
    const arr = toArray(row);
    for(let i=0; i<n; i++) out.push(String(arr[i] == null ? "" : arr[i]));
    return out;
  }

  function normalizeChar(raw){
    const c = clone(raw) || {};
    const str = k => { c[k] = c[k] == null ? "" : String(c[k]); };
    ["ownerId","ownerName","name","player","title","race","raceVariant","path","job","root","realm",
     "languages","skills","notes","notes_race","notes_path","notes_job","backgroundText","updatedBy",
     "portrait"].forEach(str);
    c.karma = num(c.karma); c.ac = num(c.ac); c.speed = num(c.speed); c.hpTemp = num(c.hpTemp);
    c.qiBase = num(c.qiBase); c.updatedAt = num(c.updatedAt); c.pb = num(c.pb);
    c.stats = Object.assign({ pot:10, con:10, int:10, per:10, luk:10, cha:10 }, c.stats || {});
    ATTRS.forEach(a => c.stats[a.id] = num(c.stats[a.id]));
    const saves = {}; ATTRS.forEach(a => saves[a.id] = !!(c.saves && c.saves[a.id])); c.saves = saves;
    c.hp = { current: num(c.hp && c.hp.current), max: num(c.hp && c.hp.max) };
    c.qi = { current: num(c.qi && c.qi.current), max: num(c.qi && c.qi.max) };
    
    // 使用 toArray 防止 Firebase 物件反序列化導致陣列清空
    c.quickActions = toArray(c.quickActions).map(r => padRow(r, 4));
    let groups = toArray(c.spellGroups);
    if(groups.length === 0){
      groups = toArray(c.spells).length
        ? [{ groupName: "主要功法", spells: c.spells }]
        : [{ groupName: "主要功法", spells: [] }];
    }
    c.spellGroups = groups.map(g => ({
      groupName: (g && g.groupName) ? String(g.groupName) : "",
      spells: toArray(g && g.spells).map(r => padRow(r, 5))
    }));
    delete c.spells;
    c.itemsList = toArray(c.itemsList).map(i => ({
      name: (i && i.name) ? String(i.name) : "",
      type: (i && i.type) ? String(i.type) : "",
      desc: (i && i.desc) ? String(i.desc) : ""
    }));
    c.notesList = toArray(c.notesList).map(n => ({
      title: (n && n.title) ? String(n.title) : "",
      body: (n && n.body) ? String(n.body) : ""
    }));
    return c;
  }

  function stable(v){
    if(Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
    if(v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
    return JSON.stringify(v == null ? null : v);
  }

  function currentChar(){
    if(!currentCharId) return null;
    if(draftId === currentCharId && draft) return draft;
    return allChars[currentCharId] ? normalizeChar(allChars[currentCharId]) : null;
  }
  function isOwner(char){ return !!(discordUser && char && char.ownerId === discordUser.id); }

  // 採用草稿時記下當下的儲物袋內容當基準：存檔前用它分辨
  // 「這筆物品是我自己刪掉的」還是「我在編輯期間長老從宗門大殿賜下來的」。
  let baseItemSigs = [];
  const itemSig = i => JSON.stringify([(i&&i.name)||"", (i&&i.type)||"", (i&&i.desc)||""]);
  function adoptDraft(){
    const c = currentCharId ? allChars[currentCharId] : null;
    draft = c ? normalizeChar(c) : null;
    draftId = currentCharId;
    baseItemSigs = draft ? draft.itemsList.map(itemSig) : [];
    dirty = false;
    migrateLegacyNotes();
  }

  // 種族／道途／職業底下的獨立筆記欄已經拿掉，統一寫在【筆記】分類裡。
  // 舊卡上若還留著字，開卡時搬進筆記分類再清空，玩家寫過的東西才不會憑空消失。
  function migrateLegacyNotes(){
    if(!draft || !isOwner(draft)) return;
    const moved = [];
    [["notes_race","種族筆記"], ["notes_path","道途筆記"], ["notes_job","職業筆記"]].forEach(([field, title]) => {
      const text = String(draft[field] || "").trim();
      if(!text) return;
      draft.notesList.push({ title, body: text });
      draft[field] = "";
      moved.push(title);
    });
    if(moved.length){
      markDirty();
      flashSaveStatus(`${moved.join("、")}已移入【筆記】分類`, false);
    }
  }

  // 登入者跳回角色卡頁時，直接開回上次看的那張自己的卡，免得每次都要重選。
  // 記在 localStorage、依 Discord ID 分開存，換人登入不會互相蓋掉。
  const LAST_CHAR_KEY = "tf_last_char";
  function lastCharSlot(){ return discordUser ? LAST_CHAR_KEY + ":" + discordUser.id : null; }
  function rememberChar(id){
    const slot = lastCharSlot(); if(!slot) return;
    try{ if(id) localStorage.setItem(slot, id); else localStorage.removeItem(slot); }
    catch(e){ /* 無痕模式等情境寫不進去，記不住就算了，不影響其他功能 */ }
  }
  function rememberedCharId(){
    const slot = lastCharSlot(); if(!slot) return null;
    try{ return localStorage.getItem(slot); }catch(e){ return null; }
  }
  // 回傳 true 代表這次真的挑了一張卡，呼叫端就知道要重新採用草稿
  function autoPickChar(){
    if(currentCharId || !discordUser) return false;
    const mine = Object.entries(allChars).filter(([,c]) => c && c.ownerId === discordUser.id);
    if(mine.length === 0) return false;
    const last = rememberedCharId();
    currentCharId = (last && mine.some(([id]) => id === last)) ? last : mine[0][0];
    return true;
  }
  function markDirty(){ dirty = true; scheduleSave(); }

  // ============================================================
  // 規則書資料
  // ============================================================
  let chapters = {}, modules = {};
  let chaptersLoaded = false, modulesLoaded = false;
  let rulebookAt = 0, rulebookBusy = false;
  const RB_CACHE_KEY = "tf_rulebook_cache_v1";

  function loadRulebookCache(){
    try{
      const raw = localStorage.getItem(RB_CACHE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      if(!d || !d.chapters || !d.modules) return;
      chapters = d.chapters; modules = d.modules;
      chaptersLoaded = modulesLoaded = true; rulebookAt = num(d.ts);
    }catch(e){ console.warn("規則書快取讀取失敗", e); }
  }
  function saveRulebookCache(){
    try{ localStorage.setItem(RB_CACHE_KEY, JSON.stringify({ ts: rulebookAt, chapters, modules })); }
    catch(e){ }
  }
  loadRulebookCache();

  async function reloadRulebook(){
    if(rulebookBusy) return;
    rulebookBusy = true; paintRulebookBtn();
    try{
      const [cs, ms] = await Promise.all([get(ref(db, "chapters")), get(ref(db, "modules"))]);
      chapters = cs.val() || {}; modules = ms.val() || {};
      chaptersLoaded = modulesLoaded = true; rulebookAt = Date.now();
      saveRulebookCache(); refreshRulebookViews();
      flashSaveStatus("規則書已重新讀取", false);
    }catch(e){
      console.error("rulebook reload error", e);
      flashSaveStatus("規則書讀取失敗：" + (e && e.message ? e.message : e), true);
    }finally{
      rulebookBusy = false; paintRulebookBtn();
    }
  }

  function paintRulebookBtn(){
    const btn = sheetEl.querySelector('[data-action="reload-rulebook"]');
    if(!btn) return;
    btn.classList.toggle("spinning", rulebookBusy);
    btn.title = rulebookBusy ? "讀取中……" : (rulebookAt ? "重新讀取規則書（上次：" + new Date(rulebookAt).toLocaleTimeString() + "）" : "重新讀取規則書");
  }

  function rulebookChapterIds(category){ return Object.entries(chapters).filter(([,c]) => (c.name || "").includes(category)).map(([id]) => id); }

  function getRulebookOptions(chapterNameContains){
    if(!(chaptersLoaded && modulesLoaded)) return { ready:false, found:false, options:[] };
    const chapterIds = rulebookChapterIds(chapterNameContains);
    if(chapterIds.length === 0) return { ready:true, found:false, options:[] };
    const titles = Object.values(modules).filter(m => chapterIds.includes(m.chapterId)).sort((a,b) => (a.order||0) - (b.order||0)).map(m => (m.title || "").split(/[:：\-－]/)[0].trim());
    return { ready:true, found:true, options:[...new Set(titles)].filter(Boolean) };
  }

  function findRulebookModule(category, titleExact){
    if(!chaptersLoaded || !modulesLoaded || !titleExact) return null;
    const cIds = rulebookChapterIds(category);
    return Object.values(modules).find(m => cIds.includes(m.chapterId) && (m.title||"").startsWith(titleExact)) || null;
  }

  const RB_SKIP_TITLE = /^(簡介|介紹|概述|概論|說明|背景|世界觀|外觀|外貌|描述|風俗|文化|歷史|故事|典故|前言|導言|序言|序|設定|定位|理念|概念|形象|扮演|角色扮演|範例對白|台詞)/;
  const RB_ACCENTS = ["#9C2B22","#8C6B27","#2D5A4C","#4A3B78","#7A4A20","#2F5878","#7C3A52"];

  function parseRuleSections(raw){
    const lines = String(raw || "").replace(/\r/g, "").split("\n");
    const out = []; let cur = { title: "", lines: [] };
    const flush = () => { if(cur.title || cur.lines.some(l => l.trim())) out.push(cur); };
    for(const line of lines){
      const t = line.trim();
      const m = t.match(/^[【《](.+?)[】》]\s*(.*)$/) || t.match(/^[◆★▲]\s*(.+?)\s*$/);
      if(m){ flush(); cur = { title: m[1].trim(), lines: m[2] ? [m[2]] : [] }; }
      else cur.lines.push(line);
    }
    flush(); return out;
  }

  const RB_BULLET = /^[+＋•·・\-–—*▪◦]\s*(.+)$/;
  // 「毒素免疫（1級）：」這種帶等級的能力名稱
  const RB_LEVEL_HEAD = /^(.{1,24}?)\s*[（(]\s*(\d+)\s*級\s*[)）]\s*[:：]?\s*(.*)$/;

  // 拆法一：帶等級標記的能力清單。沒有等級標記的條列（如「10-14：基礎毒幕」）
  // 視為上一條能力底下的細項，不會被拆成獨立卡片。
  function splitLeveledAbilities(lines){
    const abilities = []; const preamble = []; let cur = null;
    for(const raw of lines){
      const line = raw.trim();
      if(!line){ if(cur) cur.lines.push(""); else preamble.push(raw); continue; }
      const b = line.match(RB_BULLET);
      const m = b && b[1].match(RB_LEVEL_HEAD);
      if(m){
        cur = { title: m[1].trim(), level: m[2], lines: m[3] ? [m[3]] : [] };
        abilities.push(cur);
      } else if(cur){
        cur.lines.push(b ? "• " + b[1] : raw);
      } else preamble.push(raw);
    }
    return abilities.length >= 2 ? { abilities, preamble } : null;
  }

  // 拆法二：用「短標題自成一行、下面接說明」寫的能力（種族特性常見）
  // 「.」不算排除用的標點——「1. 短標題」這種編號小標題也要能被認成標題，
  // 這樣它才會在下面被判定為「底下沒內容」而濾掉，不會殘留在前一張卡片的內文裡。
  function isPlainHeading(line){
    if(!line || RB_BULLET.test(line)) return false;
    if(/[:：。，、；！？!?,]/.test(line)) return false;
    return Array.from(line).length <= 12;
  }
  function splitPlainHeadings(lines){
    const abilities = []; const preamble = []; let cur = null;
    for(const raw of lines){
      const line = raw.trim();
      if(!line){ if(cur) cur.lines.push(""); else preamble.push(raw); continue; }
      if(isPlainHeading(line)){ cur = { title: line, lines: [] }; abilities.push(cur); }
      else if(cur) cur.lines.push(raw);
      else preamble.push(raw);
    }
    // 標題底下完全沒內容的（緊接著又是另一個標題行，例如編號小標或分類大標），
    // 代表它不是真正要獨立成卡的標題，直接濾掉即可，不影響其他標題正常拆分。
    const real = abilities.filter(a => a.lines.some(l => l.trim()));
    if(real.length < 2) return null;
    return { abilities: real, preamble };
  }

  // 拆法三：「短標題：完整說明」整句寫在同一行的能力（神獸血統等擇一天賦常見）。
  // 說明一定要有句號才算數，跟「項目：簡短數值」（如「消耗：170 靈力」「火：根骨」
  // 這種條列或對照表）分開——後者要留在同一張卡裡，不能拆成一堆兩三個字的空卡片。
  const RB_INLINE_HEAD = /^([^\s:：]{1,12})[:：]\s*(\S.*)$/;
  function isInlineHeadLine(line){
    if(!line || RB_BULLET.test(line)) return false;
    const m = line.match(RB_INLINE_HEAD);
    return !!(m && !/[:：。，、；！？!?,.]/.test(m[1]) && m[2].includes("。"));
  }
  function splitInlineHeadings(lines){
    const abilities = []; const preamble = []; let cur = null;
    for(const raw of lines){
      const line = raw.trim();
      if(!line){ if(cur) cur.lines.push(""); else preamble.push(raw); continue; }
      if(isInlineHeadLine(line)){
        const m = line.match(RB_INLINE_HEAD);
        cur = { title: m[1].trim(), lines: [m[2]] }; abilities.push(cur);
      } else if(cur) cur.lines.push(raw);
      else preamble.push(raw);
    }
    return abilities.length >= 2 ? { abilities, preamble } : null;
  }

  // 先用「帶等級的能力」或「短標題＋說明」抓大結構，再對每張卡自己的內文
  // 試一次「短標題：完整說明」，把裡面擇一並列的天賦（如血統、恩賜）再拆成一塊一塊。
  // 單行的「項目：簡短數值」條列（如 引氣入體 的消耗／效果、基礎資訊的護甲／武器）
  // 沒有句號、不會被拆法三命中，仍維持在同一張卡裡用條列呈現才讀得懂。
  function rbSplitGroup(lines){
    const primary = splitLeveledAbilities(lines) || splitPlainHeadings(lines);
    if(!primary) return splitInlineHeadings(lines);
    const abilities = [];
    for(const ab of primary.abilities){
      const inner = splitInlineHeadings(ab.lines);
      if(!inner){ abilities.push(ab); continue; }
      if(inner.preamble.some(l => l.trim())) abilities.push({ title: ab.title, level: ab.level, lines: inner.preamble });
      // 拆法三拆出來的這幾張，是同一個 ab.title 底下擇一的選項（如血統、天賦），
      // 標記所屬群組，讓角色卡「種族特質」可以只顯示玩家選到的那一項。
      abilities.push(...inner.abilities.map(v => Object.assign({}, v, { variantGroup: ab.title })));
    }
    return { abilities, preamble: primary.preamble };
  }

  function rbAbilityCardHtml(title, bodyHtml, accent, level){
    return `<div class="rb-card" style="--rb-accent:${accent}">
        <div class="rb-head">${escapeHtml(title)}${level ? `<span class="rb-lv">${escapeHtml(level)}級</span>` : ""}</div>
        <div class="rb-body">${bodyHtml || '<p class="rb-p" style="color:var(--ink-faint2)">（無內容）</p>'}</div>
      </div>`;
  }

  function rbInline(text){
    return escapeHtml(text).replace(/【(.*?)】/g, '<b class="rb-term">【$1】</b>').replace(/!!(.*?)!!/g, '<span class="rb-warn">⚠ $1</span>').replace(/__(.*?)__/g, '<u>$1</u>').replace(/~~(.*?)~~/g, '<s>$1</s>').replace(/\b(DC\s?\d+)/gi, '<b class="rb-num">$1</b>').replace(/(\d*d\d+(?:\s?[+\-]\s?\d+)?)/gi, '<b class="rb-num">$1</b>').replace(/([+\-]\d+(?:\.\d+)?%?)/g, '<b class="rb-num">$1</b>');
  }

  function rbSectionBody(lines){
    const html = []; let bullets = [];
    const flushBullets = () => {
      if(!bullets.length) return;
      html.push('<ul class="rb-list">' + bullets.map(b => {
        const m = b.match(/^(.{1,14}?)\s*[:：]\s*(.+)$/);
        return "<li>" + (m ? '<b class="rb-key">' + rbInline(m[1]) + "</b>" + rbInline("：" + m[2]) : rbInline(b)) + "</li>";
      }).join("") + "</ul>"); bullets = [];
    };
    for(const rawLine of lines){
      const line = rawLine.trim();
      if(!line){ flushBullets(); continue; }
      const b = line.match(RB_BULLET);
      if(b){ bullets.push(b[1]); continue; }
      flushBullets(); html.push('<p class="rb-p">' + rbInline(line) + "</p>");
    }
    flushBullets(); return html.join("");
  }

  // 種族規則書裡「擇一亞種／血統」的群組（拆法三標記的 variantGroup）：找出第一個
  // 有這種群組的段落，回傳群組名稱與可選項目，讓角色卡的種族欄位旁邊能多開一個選單。
  // 沒有這種群組的種族（大多數）回傳 null，選單就不會出現。
  function raceVariantInfo(raceValue){
    if(!raceValue || !(chaptersLoaded && modulesLoaded)) return null;
    const m = findRulebookModule("種族", raceValue);
    if(!m || !m.content) return null;
    const sections = parseRuleSections(m.content).filter(s => s.title && !RB_SKIP_TITLE.test(s.title));
    const groups = sections.length > 0
      ? sections
      : [{ title: "", lines: String(m.content).replace(/\r/g, "").split("\n") }];
    for(const g of groups){
      const split = rbSplitGroup(g.lines);
      if(!split) continue;
      const variants = split.abilities.filter(ab => ab.variantGroup);
      if(variants.length) return { groupLabel: variants[0].variantGroup, options: variants.map(v => v.title) };
    }
    return null;
  }

  function raceVariantTagHtml(char, dis){
    const info = raceVariantInfo(char.race);
    if(!info) return "";
    const opts = info.options.map(o => `<option value="${attr(o)}" ${char.raceVariant === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("");
    return `<div class="h-tag">${escapeHtml(info.groupLabel)}
      <select class="tag-input" data-f="raceVariant" ${dis}><option value="">-- 請選擇 --</option>${opts}</select></div>`;
  }

  function rulebookBlocksHtml(category, value, showRaw){
    if(!value) return `<div class="rb-hint">請先在上方選擇${escapeHtml(category)}，此處會自動載入規則書內容。</div>`;
    if(!(chaptersLoaded && modulesLoaded)) return `<div class="rb-hint">規則書載入中……可按上方的 ↻ 重新讀取。</div>`;
    const m = findRulebookModule(category, value);
    if(!m || !m.content) return `<div class="rb-hint">規則書裡找不到「${escapeHtml(value)}」的條目。若剛在後台新增過，可按上方的 ↻ 重新讀取。</div>`;

    if(showRaw){
      return `<div class="rb-toolbar"><button class="btn rb-toggle" data-action="rb-raw" data-cat="${attr(category)}">顯示重點摘要</button></div>
        <div class="rb-card rb-raw-card"><div class="rb-head" style="--rb-accent:var(--gold)">${escapeHtml(m.title || value)} 原文</div>
        <div class="rb-body rb-raw">${rbInline(m.content)}</div></div>`;
    }

    let accentIdx = 0; const nextAccent = () => RB_ACCENTS[accentIdx++ % RB_ACCENTS.length];

    // 段落標題（【】）只是「群組」，真正要一塊一塊列出來的是群組底下的每個能力
    const sections = parseRuleSections(m.content).filter(s => s.title && !RB_SKIP_TITLE.test(s.title));
    const groups = sections.length > 0
      ? sections
      : [{ title: "", lines: String(m.content).replace(/\r/g, "").split("\n") }];

    // 種族分頁才需要「擇一亞種只顯示玩家選的那個」；道途／職業維持全部顯示，不受影響。
    const chosenVariant = category === "種族" ? ((currentChar() || {}).raceVariant || "") : "";

    const cards = groups.map(g => {
      const split = rbSplitGroup(g.lines);
      if(!split) return rbAbilityCardHtml(g.title || (m.title || value), rbSectionBody(g.lines), nextAccent());
      const pre = rbSectionBody(split.preamble);
      const seenVariantGroups = new Set();
      const abilitiesHtml = split.abilities.map(ab => {
        if(!ab.variantGroup) return rbAbilityCardHtml(ab.title, rbSectionBody(ab.lines), nextAccent(), ab.level);
        // 同一個 variantGroup 底下有好幾張卡，只在第一張出現的位置處理一次
        // （顯示選到的那張，或是提示還沒選），其餘同群組的卡直接跳過。
        if(seenVariantGroups.has(ab.variantGroup)) return "";
        seenVariantGroups.add(ab.variantGroup);
        if(!chosenVariant){
          const count = split.abilities.filter(a => a.variantGroup === ab.variantGroup).length;
          return `<div class="rb-card rb-lead" style="--rb-accent:var(--vermillion)"><div class="rb-body">
            <p class="rb-p">這個種族有 ${count} 種可選的「${escapeHtml(ab.variantGroup)}」，請先在上方選擇你的分支，這裡才會顯示對應的特質。</p></div></div>`;
        }
        const chosen = split.abilities.find(a => a.variantGroup === ab.variantGroup && a.title === chosenVariant);
        return chosen ? rbAbilityCardHtml(chosen.title, rbSectionBody(chosen.lines), nextAccent(), chosen.level) : "";
      }).join("");
      return (g.title ? `<div class="rb-group">${escapeHtml(g.title)}<span class="rb-group-n">${split.abilities.length} 項</span></div>` : "")
        + (pre ? `<div class="rb-card rb-lead" style="--rb-accent:var(--gold-deep)"><div class="rb-body">${pre}</div></div>` : "")
        + abilitiesHtml;
    }).join("");

    if(!cards){
      return `<div class="rb-toolbar"><button class="btn rb-toggle" data-action="rb-raw" data-cat="${attr(category)}">顯示完整原文</button></div>
        <div class="rb-hint">這個條目沒有可辨識的分段，請直接看原文。</div>`;
    }
    return `<div class="rb-toolbar">
        <span class="rb-source">摘自規則書：${escapeHtml(m.title || value)} · 已略過敘述性段落</span>
        <button class="btn rb-toggle" data-action="rb-raw" data-cat="${attr(category)}">顯示完整原文</button>
      </div>
      <div class="rb-wrap">${cards}</div>`;
  }

  const rbRawOpen = { "種族": false, "道途": false, "職業": false };
  const RB_PANELS = [{ cat:"種族", field:"race", box:"rbBox-race" },{ cat:"道途", field:"path", box:"rbBox-path" },{ cat:"職業", field:"job", box:"rbBox-job" }];

  function refreshRulebookViews(){
    paintRulebookBtn();
    const char = currentChar(); if(!char) return;
    RB_PANELS.forEach(p => {
      const box = document.getElementById(p.box);
      if(box) box.innerHTML = rulebookBlocksHtml(p.cat, char[p.field], rbRawOpen[p.cat]);
    });
    [["realm","境界"],["race","種族"],["path","道途"],["job","職業"]].forEach(([field, cat]) => {
      const listId = "dl-" + field;
      const datalist = document.getElementById(listId);
      if(datalist) {
        const result = getRulebookOptions(cat);
        datalist.innerHTML = result.ready ? result.options.map(o => `<option value="${attr(o)}">`).join("") : "";
      }
    });
  }

  // ============================================================
  // 角色卡清單 & 宗門大殿總覽
  // ============================================================
  const charsRef = ref(db, "characters");
  onValue(charsRef, snap => {
    charsSyncError = null;
    allChars = snap.val() || {};
    autoPickChar();
    renderCharLists();

    if(currentCharId && !allChars[currentCharId]){
      currentCharId = null; draft = null; draftId = null; dirty = false;
      renderCharLists(); renderSheet();
      return;
    }
    if(dirty || saving) return;

    // 如果使用者正在輸入文字，防止即時同步整頁重繪造成失焦
    if(document.activeElement && sheetEl.contains(document.activeElement)) {
      return;
    }

    const remote = currentCharId ? normalizeChar(allChars[currentCharId]) : null;
    if(draftId === currentCharId && draft && remote && stable(remote) === stable(draft)) return; 
    adoptDraft(); renderSheet();
  }, err => { charsSyncError = err; renderCharLists(); });

  function renderCharLists(){
    const select = document.getElementById("charSelect");
    if(charsSyncError){
      select.innerHTML = `<option value="">連線失敗：${escapeHtml(charsSyncError.message || String(charsSyncError))}</option>`;
      select.disabled = true; select.title = "很可能是 Firebase 權限規則或匿名登入沒有開放，請檢查 Firebase 主控台";
      updateDeleteBtn(); return;
    }
    select.disabled = false; select.title = "";
    select.innerHTML = '<option value="">-- 選擇角色卡 --</option>';

    const label = c => (c.name || "未命名角色") + (c.realm ? "（" + c.realm + "）" : "");
    if(discordUser){
      const mine = Object.entries(allChars).filter(([,c]) => c.ownerId === discordUser.id);
      if(mine.length > 0){
        const group = document.createElement("optgroup"); group.label = "我的角色";
        mine.forEach(([id,c]) => group.innerHTML += `<option value="${id}">${escapeHtml(label(c))}</option>`);
        select.appendChild(group);
      }
    }
    const others = Object.entries(allChars).filter(([,c]) => !discordUser || c.ownerId !== discordUser.id);
    if(others.length > 0){
      const group = document.createElement("optgroup"); group.label = "宗門其他角色";
      others.forEach(([id,c]) => group.innerHTML += `<option value="${id}">${escapeHtml(label(c))} (${escapeHtml(c.player||"未知")})</option>`);
      select.appendChild(group);
    }
    select.value = currentCharId || "";
    updateDeleteBtn();
  }

  function updateDeleteBtn(){
    const btn = document.getElementById("btnDelChar");
    if(!btn) return;
    const char = currentChar();
    const show = !!(discordUser && char && isOwner(char));
    btn.style.display = show ? "inline-flex" : "none";
    if(show) btn.title = `刪除角色卡「${char.name || "未命名角色"}」`;
  }

  document.getElementById("charSelect").addEventListener("change", async (e) => {
    if(dirty) await doSave();
    currentCharId = e.target.value || null;
    rememberChar(currentCharId);
    adoptDraft(); renderSheet(); updateDeleteBtn();
  });

  document.getElementById("btnNewChar").addEventListener("click", async () => {
    if(!discordUser) return;
    const newRef = push(charsRef);
    try{
      const fresh = blankCharacter(discordUser.id, discordUser.name);
      await set(newRef, fresh);
      allChars[newRef.key] = fresh;
      currentCharId = newRef.key;
      rememberChar(currentCharId);
      adoptDraft(); renderCharLists(); renderSheet();
    }catch(e){
      console.error("create character error", e);
      alert("建立角色卡失敗：" + (e && e.message ? e.message : e));
    }
  });

  document.getElementById("btnDelChar").addEventListener("click", async () => {
    const char = currentChar();
    if(!char || !isOwner(char)) return;
    const name = char.name || "未命名角色";
    if(!confirm(`確定要刪除角色卡「${name}」嗎？\n\n這個動作無法復原，卡上的功法、物品與筆記都會一起消失。`)) return;
    const id = currentCharId;
    try{
      clearTimeout(saveTimer); dirty = false;
      await remove(ref(db, "characters/" + id));
      delete allChars[id]; currentCharId = null; draft = null; draftId = null;
      rememberChar(null);
      autoPickChar(); adoptDraft();
      renderCharLists(); renderSheet();
      flashSaveStatus(`已刪除「${name}」`, false);
    }catch(e){ flashSaveStatus("刪除失敗：" + (e && e.message ? e.message : e), true); }
  });

  let clanWarehouse = {}, clanStones = {}, clanTreasury = {}, clanRoster = {}, clanLibrary = {};
  function watchClan(path, assign){
    onValue(ref(db, path), snap => { assign(snap.val() || {}); renderClanSummary(); }, err => console.warn(path + " summary sync error", err));
  }
  watchClan("warehouse", v => clanWarehouse = v);
  watchClan("stones",    v => clanStones = v);
  watchClan("treasury",  v => clanTreasury = v);
  watchClan("roster",    v => clanRoster = v);
  watchClan("library",   v => clanLibrary = v);

  function renderClanSummary(){
    const box = document.getElementById("clanSummary");
    const items = Object.values(clanWarehouse); const members = Object.values(clanRoster);
    const stoneTotal = ["low","mid","high","extreme"].reduce((s,k) => s + num(clanStones[k]), 0);
    if(items.length === 0 && members.length === 0 && stoneTotal === 0 && Object.keys(clanTreasury).length === 0 && Object.keys(clanLibrary).length === 0){ box.innerHTML = ""; return; }
    const catCount = c => items.filter(i => (i.category || "丹藥") === c).length;
    const realmGroups = {};
    members.forEach(m => { const g = ((m.realm || "").trim() || "未記錄").slice(0, 2); realmGroups[g] = (realmGroups[g] || 0) + 1; });
    const realmText = Object.entries(realmGroups).sort((a,b) => b[1]-a[1]).map(([g,n]) => `<span>${escapeHtml(g)} <b>${n}</b></span>`).join("");
    box.innerHTML = `
      <div class="cs-box">
        <div class="cs-head"><span class="cs-title">宗門總覽</span><span class="cs-sub">庫房物資 · 藏經閣 · 弟子境界分布</span><a class="cs-more" href="dm.html">前往宗門大殿 →</a></div>
        <div class="cs-grid">
          <div class="cs-cell"><div class="cs-label">靈石總計</div><div class="cs-value">${stoneTotal.toLocaleString()}</div></div>
          <div class="cs-cell"><div class="cs-label">丹藥</div><div class="cs-value">${catCount("丹藥")}</div></div>
          <div class="cs-cell"><div class="cs-label">法器</div><div class="cs-value">${catCount("法器")}</div></div>
          <div class="cs-cell"><div class="cs-label">材料</div><div class="cs-value">${catCount("材料")}</div></div>
          <div class="cs-cell"><div class="cs-label">符咒</div><div class="cs-value">${catCount("符咒")}</div></div>
          <div class="cs-cell"><div class="cs-label">多寶閣</div><div class="cs-value">${Object.keys(clanTreasury).length}</div></div>
          <div class="cs-cell"><div class="cs-label">藏經閣功法</div><div class="cs-value">${Object.keys(clanLibrary).length}</div></div>
          <div class="cs-cell"><div class="cs-label">宗門弟子</div><div class="cs-value">${members.length}</div></div>
        </div>
        ${realmText ? `<div class="cs-realms">境界分布 ${realmText}</div>` : ""}
      </div>`;
  }

  // ============================================================
  // 存檔
  // ============================================================
  let saveTimer = null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 600); }
  function setPath(obj, path, value){
    const parts = path.split("."); let cur = obj;
    for(let i=0; i<parts.length-1; i++){ if(typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {}; cur = cur[parts[i]]; }
    cur[parts[parts.length-1]] = value;
  }

  async function doSave(){
    clearTimeout(saveTimer);
    if(!currentCharId || !discordUser) return;
    const char = draft;
    if(!char || draftId !== currentCharId || !isOwner(char)) return;
    const id = currentCharId;
    saving = true; dirty = false;
    try{
      // 存檔是整份覆蓋。如果在我編輯的這段期間，長老從宗門大殿賜下了物品，
      // 那筆新物品只存在於資料庫、不在我的草稿裡，直接覆蓋就會把它吃掉。
      // 先把「資料庫有、我採用草稿時沒有、而且草稿裡也還沒有」的物品補回來。
      await mergeExternalItems(id, char);
      char.updatedAt = Date.now(); char.updatedBy = discordUser.name;
      await set(ref(db, "characters/" + id), char);
      allChars[id] = clone(char);
      baseItemSigs = char.itemsList.map(itemSig);
      flashSaveStatus("已自動儲存", false);
    }catch(e){
      console.error("save error", e);
      dirty = true;
      flashSaveStatus("儲存失敗：" + (e && e.message ? e.message : e), true);
    }finally{ saving = false; }
  }
  async function mergeExternalItems(id, char){
    let remoteItems = null;
    try{
      const snap = await get(ref(db, "characters/" + id + "/itemsList"));
      const raw = snap.val();
      remoteItems = Array.isArray(raw) ? raw : (raw && typeof raw === "object" ? Object.values(raw) : []);
    }catch(e){
      console.warn("merge check failed", e);   // 讀不到就照原本的存，至少不要卡住存檔
      return;
    }
    const base = baseItemSigs.slice();
    const mine = new Set(char.itemsList.map(itemSig));
    const added = [];
    remoteItems.forEach(it => {
      const sig = itemSig(it);
      const at = base.indexOf(sig);
      if(at >= 0){ base.splice(at, 1); return; }   // 本來就有的，不算新增
      if(mine.has(sig)) return;                    // 我自己也加了同一筆，不重複補
      added.push({ name:(it&&it.name)||"", type:(it&&it.type)||"", desc:(it&&it.desc)||"" });
    });
    if(added.length){
      char.itemsList = char.itemsList.concat(added);
      const names = added.map(i => i.name || "未命名物品").join("、");
      flashSaveStatus(`宗門另有賜物入袋：${names}`, false);
      refreshItemsWhenIdle();
    }
  }

  // 只重畫儲物袋那一塊（整頁重繪會把正在打字的欄位搶走焦點）；
  // 若使用者正在袋子裡打字，就等他把游標移開再補畫，不要打斷他。
  function refreshItemsWhenIdle(){
    const host = document.getElementById("itemHost");
    if(!host) return;
    if(!host.contains(document.activeElement)){ refreshItems(); return; }
    const onOut = () => setTimeout(() => {
      const h = document.getElementById("itemHost");
      if(h && h.contains(document.activeElement)) return;   // 只是換到袋子裡另一格，繼續等
      host.removeEventListener("focusout", onOut);
      refreshItems();
    }, 0);
    host.removeEventListener("focusout", onOut);
    host.addEventListener("focusout", onOut);
  }

  window.addEventListener("beforeunload", () => { if(dirty) doSave(); });

  function flashSaveStatus(msg, isError){
    const el = document.getElementById("saveStatus");
    el.textContent = msg; el.classList.toggle("error", !!isError); el.classList.add("show");
    clearTimeout(flashSaveStatus._t); flashSaveStatus._t = setTimeout(()=>el.classList.remove("show"), isError ? 5000 : 1200);
  }

  function getKarmaStyle(k){
    k = num(k);
    if(k > 0) return "--karma-color: #7C3AED; --karma-ring: #7C3AED; --karma-glow: rgba(124,58,237,0.38);";
    if(k < 0) return "--karma-color: #C8A035; --karma-ring: #C8A035; --karma-glow: rgba(200,160,53,0.40);";
    return "--karma-color: var(--ink-dim); --karma-ring: rgba(69,58,42,.42); --karma-glow: transparent;";
  }
  function karmaLabel(k){ k = num(k); return k > 0 ? "業障纏身" : (k < 0 ? "功德加身" : "清淨無染"); }

  // ===== 太極環 =====
  const RING_R = 100;
  const RING_C = 2 * Math.PI * RING_R;
  const ARC_SPAN = 168;
  // 分界線仍在 135°／315°（斜切傾斜感不變），但兩條弧左右對調：
  // 生命弧起於左下、沿左側上行，緊貼左翼的「生命值」；靈氣弧起於右上、沿右側下行，緊貼右翼的「靈氣池」。
  const HP_START = 141, QI_START = -39;
  const ARC_LEN = RING_C * ARC_SPAN / 360;
  function ringLen(res){ return (pct(res) / 100) * ARC_LEN; }

  function polar(deg, radius){
    const t = deg * Math.PI / 180;
    return { x: 120 + radius * Math.cos(t), y: 120 + radius * Math.sin(t) };
  }

  function ringMarksHtml(){
    let out = "";
    [[HP_START, 1], [QI_START, 1]].forEach(([start, dir]) => {
      [0.25, 0.5, 0.75].forEach(f => {
        const a = polar(start + dir * ARC_SPAN * f, 91);
        const b = polar(start + dir * ARC_SPAN * f, 109);
        out += `<line class="ring-tick" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`;
      });
    });
    [135, 315].forEach(a => {
      const c = polar(a, 116);
      out += `<rect class="ring-stud" x="${(c.x-3.2).toFixed(1)}" y="${(c.y-3.2).toFixed(1)}" width="6.4" height="6.4" transform="rotate(45 ${c.x.toFixed(1)} ${c.y.toFixed(1)})"/>`;
    });
    return out;
  }

  function beadDeg(kind, res){ return (kind === "hp" ? HP_START : QI_START) + ARC_SPAN * (pct(res) / 100); }
  function ringDash(len){ return len.toFixed(2) + " " + Math.max(0, RING_C - len).toFixed(2); }
  const GLOSS_R = 103.4; const GLOSS_C = 2 * Math.PI * GLOSS_R;
  function glossDash(len){ const l = len * GLOSS_R / RING_R; return l.toFixed(2) + " " + Math.max(0, GLOSS_C - l).toFixed(2); }

  function setRing(kind, res){
    const el = sheetEl.querySelector(".ring-fill." + kind);
    if(!el) return;
    const len = ringLen(res);
    el.setAttribute("stroke-dasharray", ringDash(len));
    el.style.opacity = len > 0.6 ? 1 : 0;
    const gloss = sheetEl.querySelector(".ring-gloss." + kind);
    if(gloss){ gloss.setAttribute("stroke-dasharray", glossDash(len)); gloss.style.opacity = len > 0.6 ? 1 : 0; }
    const bead = sheetEl.querySelector(".ring-bead." + kind);
    const pivot = sheetEl.querySelector(".ring-bead-pivot." + kind);
    if(bead) bead.style.opacity = len > 0.6 ? 1 : 0;
    // 光珠掛在以圓心為軸的群組上，補間的是「角度」而不是 cx/cy，
    // 這樣扣血扣氣時它會沿著弧線滑過去，不會抄對角線直接飛過圓面。
    if(pivot) pivot.style.transform = "rotate(" + beadDeg(kind, res).toFixed(2) + "deg)";
  }

  const BAGUA = ["111","110","101","100","011","010","001","000"];
  function baguaHtml(){
    const R = 80, cx = 120, cy = 120;
    return BAGUA.map((tri, i) => {
      const a = (i * 45 - 90) * Math.PI / 180;
      const x = (cx + R * Math.cos(a)).toFixed(1), y = (cy + R * Math.sin(a)).toFixed(1);
      const bars = tri.split("").map((b, j) => {
        const by = (-6 + j * 5).toFixed(1);
        return b === "1" ? `<rect x="-8" y="${by}" width="16" height="2" rx="1"/>` : `<rect x="-8" y="${by}" width="6.2" height="2" rx="1"/><rect x="1.8" y="${by}" width="6.2" height="2" rx="1"/>`;
      }).join("");
      return `<g transform="translate(${x} ${y}) rotate(${i * 45})">${bars}</g>`;
    }).join("");
  }

  // ===== 立繪（法相）=====
  const PORTRAIT_MAX_BYTES = 120000;
  const CLOUD_SVG = `<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M1.2 28.8 L1.2 8.4 Q1.2 1.2 8.4 1.2 L28.8 1.2" /><path d="M7 23.5 Q7 15 13.4 15 Q18.6 15 18.6 19.2 Q18.6 22.4 15.6 22.4 Q13.4 22.4 13.4 20.4" /></svg>`;

  function portraitHtml(char, editable){
    const src = String(char.portrait || "");
    const corners = ["tl","tr","br","bl"].map(c => `<span class="pf-corner ${c}">${CLOUD_SVG}</span>`).join("");
    return `
      <div class="ch-portrait">
        <div class="portrait-frame${src ? " has-img" : ""}" ${editable ? 'data-action="portrait-pick" role="button" tabindex="0"' : ""} title="${editable ? "點擊上傳立繪（會自動壓縮）" : "角色立繪"}">
          ${corners}
          <div class="pf-inner">
            ${src
              ? `<img class="pf-img" src="${attr(src)}" alt="法相" onerror="this.closest('.portrait-frame').classList.add('img-broken')">
                 <div class="pf-broken">圖片載入失敗<br><small>可能是網址失效或不允許外連</small></div>`
              : `<div class="pf-empty"><span class="pf-glyph">相</span><span class="pf-hint">${editable ? "點擊更換法相" : "尚未設定立繪"}</span></div>`}
          </div>
          ${editable ? `<div class="pf-tools">
              <button class="pf-tool" data-action="portrait-url" title="改用圖片網址">鏈</button>
              ${src ? `<button class="pf-tool" data-action="portrait-clear" title="移除立繪">✕</button>` : ""}
            </div>` : ""}
        </div>
      </div>`;
  }

  const portraitInput = document.createElement("input");
  portraitInput.type = "file"; portraitInput.accept = "image/*"; portraitInput.style.display = "none"; document.body.appendChild(portraitInput);

  portraitInput.addEventListener("change", async () => {
    const file = portraitInput.files && portraitInput.files[0];
    portraitInput.value = ""; if(!file) return;
    const char = currentChar(); if(!char || !isOwner(char)) return;
    try{
      flashSaveStatus("處理立繪中……", false);
      char.portrait = await shrinkImage(file);
      refreshPortrait(); markDirty(); flashSaveStatus("立繪已更新", false);
    }catch(e){
      console.error("portrait error", e); flashSaveStatus("立繪處理失敗：" + (e && e.message ? e.message : e), true);
    }
  });

  function shrinkImage(file){
    return new Promise((resolve, reject) => {
      const fr = new FileReader(); fr.onerror = () => reject(new Error("讀不到這個檔案"));
      fr.onload = () => {
        const img = new Image(); img.onerror = () => reject(new Error("這不是能讀取的圖片格式"));
        img.onload = () => {
          const scale = Math.min(1, 360 / img.naturalWidth, 470 / img.naturalHeight);
          const w = Math.max(1, Math.round(img.naturalWidth * scale)); const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d"); ctx.fillStyle = "#191410"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
          let q = 0.80, out = canvas.toDataURL("image/jpeg", q);
          while(out.length > PORTRAIT_MAX_BYTES && q > 0.35){ q -= 0.10; out = canvas.toDataURL("image/jpeg", q); }
          if(out.length > PORTRAIT_MAX_BYTES) return reject(new Error("這張圖太大了，請先裁小一點再試"));
          resolve(out);
        };
        img.src = fr.result;
      }; fr.readAsDataURL(file);
    });
  }

  function refreshPortrait(){
    const char = currentChar(); if(!char) return;
    const host = sheetEl.querySelector(".ch-portrait"); if(!host) return;
    const tmp = document.createElement("div"); tmp.innerHTML = portraitHtml(char, isOwner(char)); host.replaceWith(tmp.firstElementChild);
  }

  function fitNumberInput(el, base){
    const len = String(el.value == null ? "" : el.value).length;
    const size = len <= 4 ? base : len <= 5 ? base * 0.84 : len <= 6 ? base * 0.72 : len <= 8 ? base * 0.60 : base * 0.48;
    el.style.fontSize = Math.round(size) + "px";
    // 生命／靈氣的數字：欄寬跟著位數與縮後字級走，數字才不會被裁掉
    if(el.parentElement && el.parentElement.classList.contains("res-inputs")){
      el.style.width = Math.max(70, Math.ceil(len * size * 0.66) + 14) + "px";
    }
  }
  function fitAllNumbers(root){
    (root || sheetEl).querySelectorAll(".res-inputs input").forEach(el => fitNumberInput(el, 28));
    (root || sheetEl).querySelectorAll(".karma-input").forEach(el => fitNumberInput(el, 42));
  }

  function resizeAllTextareas(){
    sheetEl.querySelectorAll('textarea').forEach(el => {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    });
  }

          </div>
        </div>
        <!-- 中央：太極陰陽魚環。HP從上順時針，QI從下順時針 -->
        <div class="taiji-core" style="${getKarmaStyle(char.karma)}">
          <svg class="taiji-rings" viewBox="0 0 240 240" aria-hidden="true">
            <defs>
              <!-- userSpaceOnUse 的漸層是在「弧線自己 rotate 之後」的座標系裡解析的。

  function applyPathTint(char){

  // 豁免值＝屬性調整值，若該屬性有勾熟練（菱形亮起）再加上熟練加值 PB
  function saveBonus(char, id){ return mod(char.stats[id]) + (char.saves[id] ? num(char.pb) : 0); }

  function statCardHtml(a, char, dis){
    const val = num(char.stats[a.id]);
    const isProf = char.saves[a.id] ? "proficient" : "";
    return `
      <div class="stat-card ${isProf}" data-stat="${a.id}">
        <div class="stat-header"><span class="stat-name">${a.name}</span></div>
        <input class="stat-value" data-f="stats.${a.id}" type="number" value="${val}" ${dis}>
        <div class="stat-mod">${fmtMod(mod(val))}</div>
        <div class="stat-save" title="豁免＝屬性調整值${char.saves[a.id] ? " ＋ 熟練加值" : ""}">豁免 <b>${fmtMod(saveBonus(char, a.id))}</b></div>

  function paintStatCard(char, id){
    const card = sheetEl.querySelector(`.stat-card[data-stat="${id}"]`); if(!card) return;
    const modEl = card.querySelector(".stat-mod"); if(modEl) modEl.textContent = fmtMod(mod(char.stats[id]));
    const saveEl = card.querySelector(".stat-save");
    if(saveEl){
      saveEl.innerHTML = `豁免 <b>${fmtMod(saveBonus(char, id))}</b>`;
      saveEl.title = "豁免＝屬性調整值" + (char.saves[id] ? " ＋ 熟練加值" : "");

  function spellRowHtml(gIdx, rIdx, row, editable){

  // ============================================================
  // 藏經閣／多寶閣聯動
  //   功法：藏經閣本來權限就開放，弟子可以直接把整部功法拉進自己的【功法總錄】。
  //   法寶：多寶閣收的是獨一無二的法寶，不能自取；得呈遞請調卷宗，
  //         由天道或天道授權的管理長老在宗門大殿批核，賜下之後才會寫進儲物袋。
  // ============================================================
  // 藏經閣的功法品階與多寶閣的法寶品階共用同一套階梯
  const RANK_ORDER = ["凡品","黃品","玄品","地品","天品","仙品","神品"];

  function closeModal(){
    const m = document.getElementById("tfModal");
    if(m) m.remove();
    if(closeModal._esc){ document.removeEventListener("keydown", closeModal._esc); closeModal._esc = null; }
  }
  function openModal(html, onMount){
    closeModal();
    const el = document.createElement("div");
    el.className = "modal-mask"; el.id = "tfModal";
    el.innerHTML = `<div class="modal-card">${html}</div>`;
    el.addEventListener("mousedown", e => { if(e.target === el) closeModal(); });
    document.body.appendChild(el);
    closeModal._esc = e => { if(e.key === "Escape") closeModal(); };
    document.addEventListener("keydown", closeModal._esc);
    if(onMount) onMount(el);
  }

  // 跟藏經閣同一套判定：allow＝只有名單內可學、deny＝名單內不可學、其餘不限
  function passLimit(mode, list, value){
    if(mode !== "allow" && mode !== "deny") return true;
    const arr = toArray(list);
    if(arr.length === 0) return true;
    const hit = value ? arr.includes(value) : false;
    return mode === "allow" ? hit : !hit;
  }
  function canLearnArt(art, char){
    if(!char) return null;
    return passLimit(art.pathMode, art.paths, char.path)
        && passLimit(art.jobMode,  art.jobs,  char.job);
  }

  // 把一部功法攤平成功法表的五欄：技能名稱（門檻）／命中豁免／消耗動作／傷害效果／資源
  function artToSpellRows(art){
    const join = (arr, sep) => arr.map(v => String(v == null ? "" : v).trim()).filter(Boolean).join(sep);
    const rows = [];
    const meditation = String(art.meditation || "").trim();
    if(meditation) rows.push(padRow(["心法・打坐", "－", "打坐", meditation, "－"], 5));
    toArray(art.passives).forEach(p => {
      p = p || {};
      rows.push(padRow([
        (String(p.name || "").trim() || "未命名被動") + "（被動）",
        "－",
        "被動",
        join([p.effect, p.trigger ? "觸發：" + p.trigger : ""], "；") || "－",
        String(p.limit || "").trim() || "－"
      ], 5));
    });
    toArray(art.actives).forEach(a => {
      a = a || {};
      const realm = String(a.realm || "").trim();
      rows.push(padRow([
        (String(a.name || "").trim() || "未命名招式") + (realm ? "（" + realm + "）" : ""),
        String(a.hit || "").trim() || "－",
        join([a.castType, a.range, a.target], "／") || "－",
        join([a.damage, a.extra], "；") || "－",
        String(a.cost || "").trim() || "－"
      ], 5));
    });
    return rows;
  }

  // ===== 自藏經閣取用功法 =====
  let libPickSearch = "";

  function libraryRowsHtml(char){
    let list = Object.entries(clanLibrary).filter(([,a]) => a && typeof a === "object");
    const q = libPickSearch.trim().toLowerCase();
    if(q){
      list = list.filter(([,a]) => [a.name, a.intro, a.rank, a.coreAttr, a.medium, a.ownerName, a.minRealm,
        toArray(a.paths).join(" "), toArray(a.jobs).join(" ")].join(" ").toLowerCase().includes(q));
    }
    list.sort((x, y) => RANK_ORDER.indexOf(y[1].rank || "") - RANK_ORDER.indexOf(x[1].rank || "")
      || String(x[1].name || "").localeCompare(String(y[1].name || ""), "zh-Hant"));
    if(list.length === 0){
      return `<div class="pick-empty">${Object.keys(clanLibrary).length === 0
        ? "藏經閣尚無藏書，先去上傳一部功法吧。" : "沒有符合條件的功法。"}</div>`;
    }
    return list.map(([id, a]) => {
      const learn = canLearnArt(a, char);
      return `
        <button type="button" class="pick-row${learn === false ? " locked" : ""}" data-art="${attr(id)}">
          <span class="pick-name">${escapeHtml(a.name || "未命名功法")}</span>
          <div class="pick-tags">
            ${a.rank ? `<span class="pick-tag">${escapeHtml(a.rank)}</span>` : ""}
            ${a.minRealm ? `<span class="pick-tag">門檻 ${escapeHtml(a.minRealm)}</span>` : ""}
            <span class="pick-tag">被動 ${toArray(a.passives).length}・招式 ${toArray(a.actives).length}</span>
            ${learn === null ? "" : `<span class="pick-tag ${learn ? "yes" : "no"}">${learn ? "道途職業相符" : "道途／職業不符"}</span>`}
          </div>
          <div class="pick-desc">${escapeHtml(a.intro || "（尚無簡介）")}</div>
        </button>`;
    }).join("");
  }

  function openLibraryPicker(){
    const char = currentChar();
    if(!char || !isOwner(char)){ flashSaveStatus("只有卡主可以取用功法", true); return; }
    libPickSearch = "";
    openModal(`
      <div class="modal-title">自藏經閣取用功法</div>
      <div class="modal-sub">藏經閣對全宗門開放，選定一部功法就會整部抄成一張新的功法表。
        抄錄後即為這張卡上的內容，日後藏經閣再改也不會動到你，可自行增刪。</div>
      <input class="modal-field" id="libSearch" placeholder="搜尋功法名稱、簡介、品階、道途、職業……" autocomplete="off">
      <div class="pick-scroll" id="libList"></div>
      <div class="modal-foot"><button class="btn" data-modal="cancel">作罷</button></div>`, el => {
      const list = el.querySelector("#libList");
      const paint = () => { list.innerHTML = libraryRowsHtml(char); };
      paint();
      const sb = el.querySelector("#libSearch");
      sb.oninput = () => { libPickSearch = sb.value; paint(); };
      el.querySelector('[data-modal="cancel"]').onclick = closeModal;
      list.onclick = ev => {
        const row = ev.target.closest("[data-art]");
        if(row) importArt(row.dataset.art);
      };
      setTimeout(() => sb.focus(), 30);
    });
  }

  function importArt(id){
    const char = currentChar();
    const art = clanLibrary[id];
    if(!char || !isOwner(char) || !art) return;
    const name = String(art.name || "").trim() || "未命名功法";
    if(canLearnArt(art, char) === false &&
       !confirm(`【${name}】限定的道途／職業和這張卡不符。\n\n仍要抄進功法總錄嗎？`)) return;
    if(char.spellGroups.some(g => g.groupName === name) &&
       !confirm(`功法總錄裡已經有一張「${name}」了。\n\n要再抄一份嗎？`)) return;
    const rows = artToSpellRows(art);
    char.spellGroups.push({ groupName: name, spells: rows });
    closeModal();
    refreshSpells(); markDirty();
    flashSaveStatus(rows.length
      ? `已自藏經閣抄錄【${name}】，共 ${rows.length} 條`
      : `已自藏經閣抄錄【${name}】（這部功法還沒有寫任何招式）`, false);
  }

  // ===== 向內務堂請調法寶 =====
  let treasurePickSearch = "", treasurePickId = null;

  function treasureRowsHtml(){
    let list = Object.entries(clanTreasury).filter(([,t]) => t && typeof t === "object");
    const q = treasurePickSearch.trim().toLowerCase();
    if(q){
      list = list.filter(([,t]) => [t.name, t.rank, t.type, t.quote, t.holder,
        t.appearance, t.coreEffect, t.specialEffect, t.condition].join(" ").toLowerCase().includes(q));
    }
    list.sort((x, y) => RANK_ORDER.indexOf(y[1].rank || "") - RANK_ORDER.indexOf(x[1].rank || "")
      || String(x[1].name || "").localeCompare(String(y[1].name || ""), "zh-Hant"));
    if(list.length === 0){
      return `<div class="pick-empty">${Object.keys(clanTreasury).length === 0
        ? "多寶閣尚未收錄任何法寶。" : "沒有符合條件的法寶。"}</div>`;
    }
    return list.map(([id, t]) => {
      const holder = String(t.holder || "").trim();
      return `
        <button type="button" class="pick-row${treasurePickId === id ? " on" : ""}${holder ? " locked" : ""}" data-tre="${attr(id)}">
          <span class="pick-name">${escapeHtml(t.name || "未命名法寶")}</span>
          <div class="pick-tags">
            ${t.rank ? `<span class="pick-tag">${escapeHtml(t.rank)}</span>` : ""}
            ${t.type ? `<span class="pick-tag">${escapeHtml(t.type)}</span>` : ""}
            ${t.condition ? `<span class="pick-tag">限 ${escapeHtml(t.condition)}</span>` : ""}
            <span class="pick-tag ${holder ? "no" : "yes"}">${holder ? "已歸 " + escapeHtml(holder) : "尚無持有者"}</span>
          </div>
          <div class="pick-desc">${escapeHtml(t.coreEffect || t.quote || "（尚無說明）")}</div>
        </button>`;
    }).join("");
  }

  function openTreasuryRequest(){
    const char = currentChar();
    if(!discordUser){ flashSaveStatus("請先以 Discord 登入，方能呈遞卷宗", true); return; }
    if(!char || !isOwner(char)){ flashSaveStatus("只有卡主可以呈遞請調卷宗", true); return; }
    treasurePickSearch = ""; treasurePickId = null;
    openModal(`
      <div class="modal-title">向內務堂請調法寶</div>
      <div class="modal-sub">多寶閣的法寶有名有姓、獨一無二，不能自行取用。
        選定並寫下理由後，卷宗會呈進宗門大殿的【待批核卷宗】，
        由天道或天道授權的管理長老定奪；賜下之後法寶才會落進【${escapeHtml(char.name || "這張卡")}】的儲物袋。</div>
      <input class="modal-field" id="treSearch" placeholder="搜尋法寶名稱、品階、類型、效果……" autocomplete="off">
      <div class="pick-scroll" id="treList"></div>
      <label class="modal-label">請調理由</label>
      <textarea class="modal-field" id="treReason" rows="2" placeholder="例：奉命下山除魔，需此寶鎮壓屍煞"></textarea>
      <div class="modal-foot">
        <button class="btn" data-modal="cancel">作罷</button>
        <button class="btn gold-btn" data-modal="submit">呈遞卷宗</button>
      </div>`, el => {
      const list = el.querySelector("#treList");
      const reasonEl = el.querySelector("#treReason");
      const paint = () => { list.innerHTML = treasureRowsHtml(); };
      paint();
      const sb = el.querySelector("#treSearch");
      sb.oninput = () => { treasurePickSearch = sb.value; paint(); };
      list.onclick = ev => {
        const row = ev.target.closest("[data-tre]");
        if(!row) return;
        treasurePickId = treasurePickId === row.dataset.tre ? null : row.dataset.tre;
        paint();
      };
      el.querySelector('[data-modal="cancel"]').onclick = closeModal;
      el.querySelector('[data-modal="submit"]').onclick = () => submitTreasureRequest(char, reasonEl);
      setTimeout(() => sb.focus(), 30);
    });
  }

  async function submitTreasureRequest(char, reasonEl){
    const t = treasurePickId ? clanTreasury[treasurePickId] : null;
    if(!t){ flashSaveStatus("請先選定一件法寶", true); return; }
    const reason = (reasonEl.value || "").trim();
    if(!reason){ flashSaveStatus("請寫下請調理由，長老才好定奪", true); reasonEl.focus(); return; }
    const name = String(t.name || "").trim() || "未命名法寶";
    const holder = String(t.holder || "").trim();
    if(holder && !confirm(`【${name}】目前記在「${holder}」名下。\n\n仍要呈遞請調卷宗嗎？`)) return;
    try{
      const r = push(ref(db, "itemRequests"));
      await set(r, {
        kind: "treasure",
        itemId: treasurePickId,
        itemName: name,
        qty: 1,
        charId: currentCharId,
        charName: char.name || "未命名角色",
        reason,
        applicantId: discordUser.id,
        applicantName: discordUser.name,
        ts: Date.now()
      });
      closeModal();
      flashSaveStatus(`請調卷宗已呈入內務堂：【${name}】`, false);
    }catch(e){
      console.error("treasure request error", e);
      flashSaveStatus("呈遞失敗：" + (e && e.message ? e.message : e), true);
    }
  }

  function rulebookInputHtml(field, value, result, dis){
    const listId = "dl-" + field;
    let opts = result.ready ? result.options.map(o => `<option value="${attr(o)}">`).join("") : "";
    return `<input class="tag-input" data-f="${field}" list="${listId}" value="${attr(value)}" placeholder="手動填寫或選擇" ${dis} autocomplete="off"><datalist id="${listId}">${opts}</datalist>`;
  }

  function refreshQuickActions(){
    const char = currentChar(); if(!char) return;
    const host = document.getElementById("qaHost"); if(host) host.innerHTML = quickActionsHtml(char, isOwner(char));
  }
  function refreshSpells(){
    const char = currentChar(); if(!char) return;
    const host = document.getElementById("spellHost"); if(host) host.innerHTML = spellsHtml(char, isOwner(char));
  }
  function refreshItems(){
    const char = currentChar(); if(!char) return;
    const host = document.getElementById("itemHost");
    if(host) {
      host.innerHTML = itemsHtml(char, isOwner(char));
      resizeAllTextareas();
    }
  }
  function refreshNotes(){
    const char = currentChar(); if(!char) return;
    const host = document.getElementById("noteHost");
    if(host) {
      host.innerHTML = notesHtml(char, isOwner(char));
      resizeAllTextareas();
    }
  }
  function refreshQiViews(char){
    setRing("qi", char.qi);
    sheetEl.querySelectorAll('input[data-f="qi.current"], input[data-f="qi.max"]').forEach(el => {
      const field = el.dataset.f.split(".")[1];
      if(el !== document.activeElement) el.value = num(char.qi[field]);
      fitNumberInput(el, 28);
    });
  }

  // ============================================================
  // 全域事件委託
  // ============================================================
  sheetEl.addEventListener("input", (e) => {
    const el = e.target;
    const char = currentChar();

    // 任何 Textarea 輸入時全域自動增高
    if (el.tagName === "TEXTAREA") {
      el.style.height = "auto";
      el.style.height = (el.scrollHeight) + "px";
    }

    if(!char || !isOwner(char) || el.disabled) return;

    if(el.dataset.f){
      const field = el.dataset.f;
      const val = el.type === "checkbox" ? el.checked : (el.type === "number" ? (parseFloat(el.value) || 0) : el.value);
      setPath(char, field, val);

      if(field.startsWith("stats.")){
        paintStatCard(char, field.slice(6));
        if(field === "stats.per"){
          const initEl = document.getElementById("initValue");
          if(initEl) initEl.textContent = fmtMod(mod(val));
        }
      }
      // 熟練加值一改，所有有勾熟練的豁免值都要跟著變
      if(field === "pb") paintAllStatCards(char);
      if(field === "karma"){
        const core = el.closest(".taiji-core");
        if(core){
          core.style.cssText = getKarmaStyle(val);
          const sub = core.querySelector(".karma-sub");
          if(sub) sub.textContent = karmaLabel(val);
        }
        fitNumberInput(el, 42);
      }
      if(field === "hp.current" || field === "hp.max"){ setRing("hp", char.hp); fitNumberInput(el, 28); }
      if(field === "qi.current" || field === "qi.max"){ setRing("qi", char.qi); fitNumberInput(el, 28); }
      if(field === "name"){ document.getElementById("watermark").textContent = (char.name || "卡").trim().charAt(0) || "卡"; }
      if(field === "path"){
        applyPathTint(char);
        const box = document.getElementById("rbBox-path"); if(box) box.innerHTML = rulebookBlocksHtml("道途", char.path, rbRawOpen["道途"]);
      }
      if(field === "race"){
        // 換了種族，原本選的亞種／血統多半已經不適用，一併清掉，選單也要重新產生
        // （不同種族的選項不一樣，換種族後可能整個消失或換一批選項）。
        if(char.raceVariant) setPath(char, "raceVariant", "");
        const slot = document.getElementById("raceVariantSlot"); if(slot) slot.innerHTML = raceVariantTagHtml(char, isOwner(char) ? "" : "disabled");
        const box = document.getElementById("rbBox-race"); if(box) box.innerHTML = rulebookBlocksHtml("種族", char.race, rbRawOpen["種族"]);
      }
      if(field === "raceVariant"){
        const box = document.getElementById("rbBox-race"); if(box) box.innerHTML = rulebookBlocksHtml("種族", char.race, rbRawOpen["種族"]);
      }
      if(field === "job"){
        const box = document.getElementById("rbBox-job"); if(box) box.innerHTML = rulebookBlocksHtml("職業", char.job, rbRawOpen["職業"]);
      }
      markDirty(); return;
    }

    if(el.dataset.table){
      const table = el.dataset.table, row = parseInt(el.dataset.row, 10), col = parseInt(el.dataset.col, 10);
      if(!Array.isArray(char[table])) char[table] = [];
      if(!char[table][row]) char[table][row] = padRow([], 4);
      char[table][row][col] = el.value;
      if(table === "quickActions" && col === 2){
        const pill = sheetEl.querySelector(`[data-qa-cost="${row}"]`);
        if(pill){
          const text = qaCostText(char[table][row]); pill.textContent = text; pill.classList.toggle("empty", !text);
        }
      }
      markDirty(); return;
    }

    if(el.dataset.sgname != null){ const g = char.spellGroups[parseInt(el.dataset.sgname, 10)]; if(g) g.groupName = el.value; markDirty(); return; }
    if(el.dataset.sg != null){
      const g = char.spellGroups[parseInt(el.dataset.sg, 10)]; const r = g && g.spells[parseInt(el.dataset.sr, 10)];
      if(r) r[parseInt(el.dataset.sc, 10)] = el.value; markDirty(); return;
    }
    if(el.dataset.item != null){
      const it = char.itemsList[parseInt(el.dataset.item, 10)]; if(it) it[el.dataset.prop] = el.value; markDirty(); return;
    }
    if(el.dataset.note != null){
      const n = char.notesList[parseInt(el.dataset.note, 10)]; if(n) n[el.dataset.prop] = el.value; markDirty(); return;
    }
  });

  sheetEl.addEventListener("click", (e) => {
    const char = currentChar();
    const editable = isOwner(char);
    
    // 點擊屬性卡切換熟練，但點擊輸入框時不觸發
    const statCard = e.target.closest(".stat-card");
    if(statCard && editable && e.target.tagName !== "INPUT"){
      const statId = statCard.dataset.stat;
      char.saves[statId] = !char.saves[statId];
      statCard.classList.toggle("proficient", char.saves[statId]);
      paintStatCard(char, statId);
      markDirty(); return;
    }

    const tabBtn = e.target.closest(".tab-btn");
    if(tabBtn){
      activeTab = tabBtn.dataset.tab;
      sheetEl.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === tabBtn));
      sheetEl.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === activeTab));
      resizeAllTextareas();
      return;
    }

    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;

    if(action === "reload-rulebook"){ reloadRulebook(); return; }
    if(action === "rb-raw"){
      const cat = btn.dataset.cat; rbRawOpen[cat] = !rbRawOpen[cat];
      if(!char) return; const panel = RB_PANELS.find(p => p.cat === cat);
      const box = panel && document.getElementById(panel.box);
      if(box) box.innerHTML = rulebookBlocksHtml(cat, char[panel.field], rbRawOpen[cat]);
      return;
    }

    if(!char || !editable) return;

    if(action === "portrait-pick"){ portraitInput.click(); return; }
    if(action === "portrait-url"){
      const url = prompt("貼上立繪圖片網址（http/https）：", String(char.portrait || "").startsWith("data:") ? "" : (char.portrait || ""));
      if(url === null) return; const clean = url.trim();
      if(clean && !/^https?:\/\//i.test(clean)){ flashSaveStatus("請貼上 http 或 https 開頭的網址", true); return; }
      char.portrait = clean; refreshPortrait(); markDirty(); return;
    }
    if(action === "portrait-clear"){
      if(!confirm("要移除這張立繪嗎？")) return; char.portrait = ""; refreshPortrait(); markDirty(); return;
    }

    if(action === "use-qa"){
      const row = char.quickActions[parseInt(btn.dataset.row, 10)] || [];
      const cost = parseInt(row[2], 10) || 0;
      if(cost > 0){
        char.qi.current = Math.max(0, num(char.qi.current) - cost);
        refreshQiViews(char); flashSaveStatus(`${row[0] || "招式"} 施展：靈氣 −${cost}`, false); markDirty();
      }else{ flashSaveStatus("這個動作沒有填數字的耗氣值", true); }
      return;
    }
    if(action === "add-row"){
      const t = btn.dataset.table; if(!Array.isArray(char[t])) char[t] = [];
      char[t].push(padRow([], parseInt(btn.dataset.cols, 10) || 4)); refreshQuickActions();
      const cards = sheetEl.querySelectorAll(".qa-card"); const last = cards[cards.length - 1];
      if(last){ last.classList.add("just-added"); const n = last.querySelector(".qa-name"); if(n) n.focus(); }
      markDirty(); return;
    }
    if(action === "del-row"){ char[btn.dataset.table].splice(parseInt(btn.dataset.row, 10), 1); refreshQuickActions(); markDirty(); return; }

    if(action === "pick-art"){ openLibraryPicker(); return; }
    if(action === "pick-treasure"){ openTreasuryRequest(); return; }

    if(action === "add-spellgroup"){ char.spellGroups.push({ groupName:"新功法表", spells:[] }); refreshSpells(); markDirty(); return; }
    if(action === "del-spellgroup"){
      const g = char.spellGroups[parseInt(btn.dataset.gidx, 10)];
      if(g && (g.spells.length > 0 || g.groupName) && !confirm(`確定刪除功法表「${g.groupName || "未命名"}」？裡面的 ${g.spells.length} 招也會一起刪除。`)) return;
      char.spellGroups.splice(parseInt(btn.dataset.gidx, 10), 1); refreshSpells(); markDirty(); return;
    }
    if(action === "add-spellrow"){
      const g = char.spellGroups[parseInt(btn.dataset.gidx, 10)];
      if(g){ g.spells.push(padRow([], 5)); refreshSpells(); markDirty(); }
      return;
    }
    if(action === "del-spellrow"){
      const g = char.spellGroups[parseInt(btn.dataset.gidx, 10)];
      if(g){ g.spells.splice(parseInt(btn.dataset.ridx, 10), 1); refreshSpells(); markDirty(); }
      return;
    }

    if(action === "add-item"){ char.itemsList.push({name:"", type:"", desc:""}); refreshItems(); markDirty(); return; }
    if(action === "del-item"){ char.itemsList.splice(parseInt(btn.dataset.idx, 10), 1); refreshItems(); markDirty(); return; }

    if(action === "add-note"){ char.notesList.push({title:"", body:""}); refreshNotes(); markDirty(); return; }
    if(action === "del-note"){ char.notesList.splice(parseInt(btn.dataset.idx, 10), 1); refreshNotes(); markDirty(); return; }
  });

  onValue(ref(db, "chapters"), snap => { chapters = snap.val() || {}; chaptersLoaded = true; rulebookAt = Date.now(); saveRulebookCache(); refreshRulebookViews(); }, err => console.error("chapters sync error", err));
  onValue(ref(db, "modules"), snap => { modules = snap.val() || {}; modulesLoaded = true; rulebookAt = Date.now(); saveRulebookCache(); refreshRulebookViews(); }, err => console.error("modules sync error", err));

  renderSheet();
  initDiscordAuth();
</script>
</body>
</html>
